   {section:'pack',sort:1000,data:{sectionTitle:'🧳 打包 & 提醒',title:'保暖（重中之重）',body:'- 长款厚羽绒 + 防风外层\n- 速干内层 + 抓绒（忌纯棉贴身）\n- 防滑雪地靴 + 厚羊毛袜\n- 防风帽 / 围脖面罩 / 防水厚手套'}},
   {section:'pack',sort:1010,data:{sectionTitle:'🧳 打包 & 提醒',title:'滑雪 & 防护',body:'- 雪镜 + 头盔\n- 高倍防晒 + 润唇膏\n- 暖宝宝 / 护膝\n- 备用手套袜子'}},
   {section:'pack',sort:1020,data:{sectionTitle:'🧳 打包 & 提醒',title:'关键提醒',body:'- 首尾为夜间航班，安排好深夜打车\n- 13 日高铁 17:27，16:30 前回沈阳北站\n- 气温为预报，以当天实时为准'}},
   {section:'planb',sort:1100,data:{sectionTitle:'🔄 备选方案',title:'14 日晚 · 备选',body:'仙人桥温泉泡汤 / 瑞士小镇酒吧街 / 酒店 SPA 早睡。'}},
   {section:'planb',sort:1110,data:{sectionTitle:'🔄 备选方案',title:'15 日晚 · 备选',body:'讷殷古城夜游（灯光 + 萨满演艺）/ 娱雪乐园夜场雪圈（若开放）。'}},
   {section:'planb',sort:1120,data:{sectionTitle:'🔄 备选方案',title:'16 日白天 · 备选',body:'漂流停开则全程待华美周边：娱雪乐园 + 喂驯鹿 + 火山温泉；下午木屋村 / 古城 + 万良人参小镇。'}},
  ];
  // 渲染：按 section 分组 → 板块标题 + 卡片网格
  const app=$('#app');
  function bodyHTML(b){return !b?'':esc(b).split('\n').map(l=>l.startsWith('- ')?'• '+l.slice(2):l).join('<br>');}
  function cardEl(r){
    const d=r.data||{};
    const art=document.createElement('article');art.className='card';art.dataset.id=r.id;
    art.innerHTML=(d.tag?'<span class="tg">'+esc(d.tag)+'</span>':'')
      +'<h3>'+esc(d.title||'(未命名)')+'</h3>'
      +(d.subtitle?'<div class="sub">'+esc(d.subtitle)+'</div>':'')
      +(d.body?'<div class="bd">'+bodyHTML(d.body)+'</div>':'')
      +(d.note?'<div class="nt">'+bodyHTML(d.note)+'</div>':'')
      +'<button class="edit" title="编辑">✎</button><button class="del" title="删除">×</button>';
    art.querySelector('.del').addEventListener('click',()=>removeCard(r));
    art.querySelector('.edit').addEventListener('click',()=>openModal(r));
    return art;
  }
  function render(rows){
    app.innerHTML='';
    rows=rows.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
    const order=[],bySec={};
    rows.forEach(r=>{const s=r.section||'';if(!bySec[s]){bySec[s]=[];order.push(s);}bySec[s].push(r);});
    order.forEach(s=>{
      const sec=document.createElement('section');sec.className='sec';
      const title=(bySec[s][0].data||{}).sectionTitle||s;
      sec.innerHTML='<h2>'+esc(title)+'</h2>';
      const grid=document.createElement('div');grid.className='grid';
      bySec[s].forEach(r=>grid.appendChild(cardEl(r)));
      sec.appendChild(grid);app.appendChild(sec);
    });
  }
  async function startup(){
    let {data,error}=await sb.from('pages_blocks').select('*').eq('page',PAGE);
    if(error){banner('实时同步未连接：请确认已在 Supabase 建好 pages_blocks 表并授权');return;}
    if(!data||!data.length){
      const {error:e2}=await sb.from('pages_blocks').insert(DEFAULTS.map(d=>Object.assign({page:PAGE},d)));
      if(e2){banner('初始化写入失败：'+e2.message);return;}
      ({data}=await sb.from('pages_blocks').select('*').eq('page',PAGE));
    }
    render(data||[]);
  }
  async function refresh(){const {data,error}=await sb.from('pages_blocks').select('*').eq('page',PAGE);if(!error)render(data||[]);}
  async function removeCard(r){
    if(!confirm('确定删除「'+((r.data||{}).title||'')+'」？所有人都会同步删除。'))return;
    const {error}=await sb.from('pages_blocks').delete().eq('id',r.id);
    if(error){alert('删除失败：'+error.message);return;}
    await refresh();
  }
  $('#editToggle').addEventListener('click',function(){document.body.classList.toggle('editing');this.classList.toggle('on');this.textContent=document.body.classList.contains('editing')?'完成':'编辑';});
  const modal=$('#modal');let editId=null;
  function v(id){return $('#'+id).value.trim();}
  function openModal(r){
    const d=r?(r.data||{}):{};editId=r?r.id:null;
    $('#mTitle').textContent=r?'编辑卡片':'添加卡片';
    $('#f_section').value=r?(r.section||''):'';$('#f_sort').value=r?(r.sort||''):'';
    $('#f_sectitle').value=d.sectionTitle||'';$('#f_title').value=d.title||'';
    $('#f_subtitle').value=d.subtitle||'';$('#f_tag').value=d.tag||'';
    $('#f_body').value=d.body||'';$('#f_note').value=d.note||'';
    modal.classList.add('open');
  }
  $('#addBtn').addEventListener('click',()=>openModal(null));
  $('#mCancel').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});
  $('#mSave').addEventListener('click',async()=>{
    const title=v('f_title');if(!title){alert('请填写标题');return;}
    const data={sectionTitle:v('f_sectitle'),title,subtitle:v('f_subtitle'),tag:v('f_tag'),body:$('#f_body').value,note:v('f_note')};
    const rec={page:PAGE,section:v('f_section')||'custom',sort:parseInt(v('f_sort'))||9999,data};
    let error;
    if(editId){({error}=await sb.from('pages_blocks').update(rec).eq('id',editId));}
    else{({error}=await sb.from('pages_blocks').insert(rec));}
    if(error){alert('保存失败：'+error.message);return;}
    await refresh();modal.classList.remove('open');editId=null;
    if(!document.body.classList.contains('editing'))$('#editToggle').click();
  });
  $('#exportBtn').addEventListener('click',async()=>{
    const {data}=await sb.from('pages_blocks').select('*').eq('page',PAGE);
    const blob=new Blob([JSON.stringify(data||[],null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=PAGE+'.json';a.click();
  });
  $('#resetBtn').addEventListener('click',async()=>{
    if(!confirm('还原默认会清空本页所有卡片并重置为默认，影响所有人。确定？'))return;
    await sb.from('pages_blocks').delete().eq('page',PAGE);
    await sb.from('pages_blocks').insert(DEFAULTS.map(d=>Object.assign({page:PAGE},d)));
    await refresh();
  });
  sb.channel('blocks-'+PAGE).on('postgres_changes',{event:'*',schema:'public',table:'pages_blocks'},refresh).subscribe();
  startup();
})();
</script>
</body>
</html>

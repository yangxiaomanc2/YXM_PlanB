on":"v2:regions","sort":220,"data":{"sectionTitle":"中国主要滑雪目的地","title":"吉林 · 松花湖","subtitle":"长道练习 / 综合度假","tag":"东北核心","body":"适合从初中级到中高级滑雪者，长雪道体验与吉林雾凇、城市餐饮可以组合。","note":"雪场到吉林市有接驳需求，提前确认末班车和夜场交通。"}},{"section":"v2:regions","sort":230,"data":{"sectionTitle":"中国主要滑雪目的地","title":"吉林 · 长白山万达 / 华美胜地 / 鲁能","subtitle":"滑雪 + 温泉 + 雪村度假","tag":"度假型","body":"长白山片区适合把滑雪与温泉、雪地娱乐和度假酒店结合。万达、华美、鲁能分属不同片区，不能把雪票、住宿和接驳混为一谈。","note":"长白山西坡、北坡、机场和各度假区距离不近；天池冬季开放也需单独核实。"}},{"section":"v2:regions","sort":240,"data":{"sectionTitle":"中国主要滑雪目的地","title":"河北 · 崇礼","subtitle":"万龙 / 云顶 / 太舞 / 富龙 / 翠云山","tag":"北京周边首选","body":"多个雪场集中，适合短假期和多雪场体验。万龙偏向中高级与训练；云顶有冬奥赛事背景；太舞度假小镇配套成熟；富龙靠近崇礼城区。","note":"雪场间不是全部滑进滑出，跨场接驳和住宿位置会决定有效滑雪时间。"}},{"section":"v2:regions","sort":250,"data":{"sectionTitle":"中国主要滑雪目的地","title":"黑龙江 · 亚布力","subtitle":"滑雪传统目的地 + 哈尔滨","tag":"东北组合","body":"适合把滑雪和哈尔滨城市冰雪旅行放在一趟行程。亚布力由不同雪场和运营区组成，订票时确认具体雪场和雪道开放情况。","note":"哈尔滨至亚布力西站后仍需接驳到酒店 / 雪场。"}},{"section":"v2:regions","sort":260,"data":{"sectionTitle":"中国主要滑雪目的地","title":"北京 · 南山 / 怀北 / 军都山 / 渔阳","subtitle":"周末练习 / 当日往返","tag":"短途","body":"适合北京周边一日滑、夜场和周末练习。对上海出发的专程滑雪旅行，除非结合北京行程，否则不如崇礼多日滑雪划算。","note":"周末高峰、雪道开放比例、夜场时间和交通拥堵需提前确认。"}},{"section":"v2:regions","sort":270,"data":{"sectionTitle":"中国主要滑雪目的地","title":"陕西 · 鳌山","subtitle":"西北内陆进阶滑雪","tag":"区域选择","body":"可作为西北地区滑雪旅行的补充，适合结合太白山区域行程。","note":"高海拔、气候与交通需按雪季实时公告安排。"}},{"section":"v2:regions","sort":280,"data":{"sectionTitle":"中国主要滑雪目的地","title":"湖北 · 神农架","subtitle":"南方滑雪体验 / 森林雪景","tag":"南方选择","body":"适合华中游客体验滑雪与森林雪景，适合初中级休闲和家庭行程。","note":"雪季较短，依赖气温与造雪条件，开板前不要提前锁死不可退住宿。"}},{"section":"v2:regions","sort":290,"data":{"sectionTitle":"中国主要滑雪目的地","title":"四川 · 西岭雪山 / 太子岭","subtitle":"西南周边滑雪","tag":"南方选择","body":"适合成都及周边游客，把滑雪与山地景观结合；适合初中级和休闲旅行。","note":"南方雪场受气温和天气影响更明显，务必确认实际开放雪道和造雪条件。"}},{"section":"v2:regions","sort":300,"data":{"sectionTitle":"中国主要滑雪目的地","title":"内蒙古 · 美林谷","subtitle":"北方度假与练习","tag":"补充选择","body":"适合结合赤峰及周边旅行，作为北方滑雪目的地的补充。","note":"出行前确认当季运营状态、雪道和接驳，避免仅依据往年雪季规划。"}},{"section":"v2:season","sort":300,"data":{"sectionTitle":"什么时候去：雪季时间线","title":"10 月下旬—11 月","subtitle":"早雪季：新疆高海拔与崇礼先行","tag":"时间","body":"可可托海、崇礼部分雪场通常较早启动，但初期开放道数可能有限。适合想抢早雪、时间灵活的人。","note":"2026—27 雪季公开报道：可可托海 10 月 20 日开板，万龙 10 月 23 日开板；仅代表当时开板，不代表全山开放。"}},{"section":"v2:season","sort":310,"data":{"sectionTitle":"什么时候去：雪季时间线","title":"12 月—次年 2 月","subtitle":"主雪季：东北、崇礼与阿勒泰","tag":"时间","body":"多数雪场进入主运营期，雪道开放通常更完整。春节是客流高峰，预算和住宿要提前准备。","note":"自然降雪、造雪、温度和风力会影响每天开放雪道。"}},{"section":"v2:season","sort":320,"data":{"sectionTitle":"什么时候去：雪季时间线","title":"1—2 月","subtitle":"追粉雪与雪质的热门窗口","tag":"雪质","body":"阿勒泰、吉林和黑龙江值得重点考虑；但热门假期价格高、交通易受天气影响。","note":"雪质受天气影响，不能保证某一周必有粉雪。"}},{"section":"v2:season","sort":330,"data":{"sectionTitle":"什么时候去：雪季时间线","title":"3 月—4 月","subtitle":"春雪与错峰滑雪","tag":"时间","body":"部分东北、新疆高海拔雪场仍可能运营，气温较舒适、错峰有机会降低住宿压力。","note":"逐雪场确认封板时间、雪况和索道运行，不要按地区平均雪季推断。"}},{"section":"v2:season","sort":340,"data":{"sectionTitle":"什么时候去：雪季时间线","title":"2026—27 雪季已公开开板信息","subtitle":"截至 2026-11-26 的公开报道","tag":"当季动态","body":"中国旅游报 10 月 26 日汇总：可可托海 10/20、万龙 10/23 已开板；北大湖 11/7 试滑；长白山华美 11/14 试滑、11/21 正式运营；长白山万达 11/21 开板。","note":"注意：吉克普林、北大湖等早期阶段均曾分批开放索道和雪道；开板不等于全山开放。松花湖计划日期与正式运营状态仍应以官方当日公告复核。"}},{"section":"v2:itineraries","sort":400,"data":{"sectionTitle":"旅行方案：按天数规划","title":"上海出发 · 崇礼 4 天 3 夜","subtitle":"北京转高铁 / 接驳 · 2—3 个滑雪日","tag":"4 天","body":"D1 上海飞北京，转高铁到太子城 / 崇礼并入住；D2 万龙或云顶整日滑；D3 太舞或富龙体验；D4 上午轻滑或返程。","note":"适合第一次专程滑雪、希望交通相对可控的人。提前确认雪具上高铁规定和雪场接驳。"}},{"section":"v2:itineraries","sort":410,"data":{"sectionTitle":"旅行方案：按天数规划","title":"上海出发 · 北大湖 5 天 4 夜","subtitle":"吉林门户 · 3 个完整滑雪日","tag":"5 天","body":"D1 抵达长春 / 吉林并入住；D2 转场北大湖、熟悉雪场；D3—D4 两天完整滑雪；D5 视航班安排半天滑雪或返程。","note":"如果滑雪水平较高，建议加一天；若新手第一天上课，不建议压缩到两天。"}},{"section":"v2:itineraries","sort":420,"data":{"sectionTitle":"旅行方案：按天数规划","title":"上海出发 · 长白山 5 天 4 夜","subtitle":"滑雪 + 温泉 + 雪地度假","tag":"5 天","body":"D1 抵达长白山机场或高铁站、入住度假区；D2 初级课和基础滑行；D3 完整滑雪；D4 温泉 / 雪地活动 / 视体力补滑；D5 返程。","note":"万达、华美、鲁能的地理位置和产品不同，先确定雪场再订酒店。"}},{"section":"v2:itineraries","sort":430,"data":{"sectionTitle":"旅行方案：按天数规划","title":"上海出发 · 阿勒泰 7 天 6 夜","subtitle":"将军山 + 禾木 / 可可托海择一","tag":"7 天","body":"D1 抵达乌鲁木齐或阿勒泰门户；D2 转场并休整；D3—D5 选择一个主雪场连续滑；D6 机动天气 / 城镇游览；D7 返程。","note":"不要把将军山、禾木吉克普林、可可托海三个点硬塞进 5 天；跨区域转场很耗时。"}},{"section":"v2:itineraries","sort":440,"data":{"sectionTitle":"旅行方案：按天数规划","title":"上海出发 · 亚布力 + 哈尔滨 6 天 5 夜","subtitle":"滑雪 2—3 天 + 城市冰雪体验","tag":"6 天","body":"D1 抵达哈尔滨；D2 高铁 / 接驳去亚布力；D3—D4 滑雪；D5 返回哈尔滨游览；D6 返程。","note":"适合滑雪与城市旅行并重的人。春节期间为哈尔滨冰雪景点与滑雪高峰，尽早订票。"}},{"section":"v2:itineraries","sort":450,"data":{"sectionTitle":"旅行方案：按天数规划","title":"周末短滑 · 北京周边 2 天 1 夜","subtitle":"南山 / 怀北 / 军都山 / 渔阳","tag":"2 天","body":"D1 到北京并住雪场接驳方便的位置；D2 全天滑雪或夜场后返程。若已在北京，可当日往返。","note":"上海专程往返只滑一天通常不划算，建议结合北京旅行或选择崇礼多日滑。"}},{"section":"v2:budget","sort":500,"data":{"sectionTitle":"预算与预订：钱花在哪","title":"预算结构","subtitle":"雪票 + 雪具 + 教练 + 住宿 + 接驳","tag":"费用","body":"滑雪旅行主要成本通常是雪票、雪具租赁、课程、住宿、交通与餐饮。新手第一次上课的支出往往比多买一天雪票更值得。","note":"不同雪场、日期、票种和渠道差异很大，本文不把历史票价当作 2026—27 实时报价。"}},{"section":"v2:budget","sort":510,"data":{"sectionTitle":"预算与预订：钱花在哪","title":"节假日与周末","subtitle":"春节 / 元旦 / 周末溢价","tag":"预订","body":"热门雪场的酒店、机票和雪票会在节假日集中上涨。优先确定雪场和日期，再订可取消住宿，最后安排接驳。","note":"查看退改政策，尤其航班延误、道路封闭和雪场停运的处理规则。"}},{"section":"v2:budget","sort":520,"data":{"sectionTitle":"预算与预订：钱花在哪","title":"住宿位置","subtitle":"滑进滑出 vs 城镇住宿","tag":"住宿","body":"新手和多日滑雪者优先住雪场附近，节省早晚通勤；预算有限可住城镇，但必须核实班车时刻与末班车。","note":"地图直线距离不能代表冬季真实通行时间。"}},{"section":"v2:budget","sort":530,"data":{"sectionTitle":"预算与预订：钱花在哪","title":"雪票与雪具","subtitle":"看清票种包含内容","tag":"票务","body":"确认日场 / 夜场、缆车范围、魔毯、雪具是否包含、押金、保险、取还装备时间及是否需要预约。","note":"第三方平台套餐与现场票可能有不同限制，逐条核对。"}},{"section":"v2:budget","sort":540,"data":{"sectionTitle":"预算与预订：钱花在哪","title":"教练与安全","subtitle":"新手第一天建议正规课程","tag":"教学","body":"选择雪场官方或正规机构认证教练，先学摔倒起身、刹停、控速、避让和缆车乘坐。","note":"不要在未掌握控速与转弯前进入中高级道。"}},{"section":"v2:gear","sort":600,"data":{"sectionTitle":"装备、技能与安全","title":"新手装备","subtitle":"头盔优先，其次雪镜与手套","tag":"装备","body":"初学者可租雪板、雪鞋、雪杖；自备速干内层、保暖中层、防水外层、雪袜、手套和护脸。头盔必须合适佩戴。","note":"不要穿牛仔裤或棉质厚袜滑雪，湿冷后容易失温和磨脚。"}},{"section":"v2:gear","sort":610,"data":{"sectionTitle":"装备、技能与安全","title":"进阶装备","subtitle":"雪板长度、硬度与靴子匹配","tag":"装备","body":"进阶者根据身高体重、滑行风格、雪况和能力选板；雪鞋合脚比追求昂贵板型更重要。","note":"第一次到陌生雪场，先熟悉雪道地图和安全规则。"}},{"section":"v2:gear","sort":620,"data":{"sectionTitle":"装备、技能与安全","title":"雪道礼仪","subtitle":"控制速度、上方观察、停在边缘","tag":"安全","body":"滑行者必须控制速度和方向；超越时留足空间；起步和进入雪道前向上方观察；停留不要挡住雪道中央或视线盲区。","note":"遇到封闭雪道、巡逻提示和恶劣天气必须遵守现场管理。"}},{"section":"v2:gear","sort":630,"data":{"sectionTitle":"装备、技能与安全","title":"野雪与雪崩风险","subtitle":"不要把道外当作普通进阶道","tag":"高风险","body":"道外滑行需要雪崩知识、伙伴救援装备、当地雪况信息和专业向导。仅有高阶滑行技术并不等于具备雪崩风险管理能力。","note":"无向导、无雪崩信标 / 探杆 / 铲具训练，不进入未经管理的野雪区域。"}},{"section":"v2:gear","sort":640,"data":{"sectionTitle":"装备、技能与安全","title":"旅行打包","subtitle":"保暖、防水、护肤和电池","tag":"清单","body":"准备滑雪服、雪裤、速干内层、抓绒、头盔、雪镜、面罩、防水手套、雪袜、防晒、润唇膏、暖宝宝和备用电池。","note":"低温会让手机和相机电池掉电更快，贴身保温并备充电宝。"}},{"section":"v2:sources","sort":700,"data":{"sectionTitle":"当季信息与参考","title":"2026—27 雪季开板汇总","subtitle":"中国旅游报转载汇总 · 2026-10-26","tag":"当季来源","body":"公开信息显示可可托海 10 月 20 日开板、万龙 10 月 23 日开板；北大湖 11 月 7 日试滑；长白山华美 11 月 14 日试滑、21 日正式运营；长白山万达 11 月 21 日开板。","note":"报道汇总仅作为季初时间线，实时开放道数请查雪场官方账号。"}},{"section":"v2:sources","sort":710,"data":{"sectionTitle":"当季信息与参考","title":"阿勒泰雪场交通与区域差异","subtitle":"吉克普林 / 将军山 / 可可托海","tag":"交通","body":"将军山靠近阿勒泰市；吉克普林位于禾木区域；可可托海位于富蕴县。应按雪场分别规划机场、火车站和道路接驳。","note":"冬季道路可能因降雪、风吹雪和管制变化，留出机动时间。"}},{"section":"v2:sources","sort":720,"data":{"sectionTitle":"当季信息与参考","title":"既有榜单与专项行程","subtitle":"YXM Plan B 内部攻略","tag":"站内延伸","body":"本目录另有《中国滑雪场 TOP 20》榜单和《上海 → 长白山滑雪 5 天》专项行程，可用于进一步比较雪场数据和落地路线。","note":"榜单里的雪道长度、落差和价格口径需结合原始数据来源与当季公告复核。"}}];const $=s=>document.querySelector(s),app=$("#app");let rows=[],editId=null,heroId=null;
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function drawHero(d){const h=$("#hero");h.replaceChildren();h.append(el("div","eyebrow",d.eyebrow||"YXM PLAN B"));h.append(el("h1","",d.title||"旅行攻略"));h.append(el("p","lead",d.lead||""));const facts=el("div","facts");(d.facts||[]).forEach(f=>{const x=el("div","fact"),v=el("div","v",f.value),l=el("div","l",f.label);x.append(v,l);facts.append(x)});h.append(facts);const edit=el("button","btn","编辑首屏");edit.style.display=document.body.classList.contains("editing")?"inline-block":"none";edit.onclick=()=>openHero(d);h.append(edit)}
function draw(){const h=rows.find(r=>r.section==="v2:hero");heroId=h?.id||null;drawHero(h?.data||DEFAULTS[0].data);app.replaceChildren();$("#toc").replaceChildren();const sections=new Map();rows.filter(r=>r.section!=="v2:hero").sort((a,b)=>(a.sort||0)-(b.sort||0)).forEach(r=>{if(!sections.has(r.section))sections.set(r.section,[]);sections.get(r.section).push(r)});
let idx=0;for(const [key,list] of sections){const id="section-"+idx++,sec=el("section","sec");sec.id=id;const title=list[0]?.data?.sectionTitle||key.replace("v2:","");sec.append(el("h2","",title));const grid=el("div","grid");list.forEach(r=>{const d=r.data||{},card=el("article","card");if(d.tag)card.append(el("span","tag",d.tag));card.append(el("h3","",d.title||"未命名"));if(d.subtitle)card.append(el("p","sub",d.subtitle));if(d.body)card.append(el("div","body",d.body));if(d.note)card.append(el("div","note",d.note));const e=el("button","edit","✎"),del=el("button","del","×");e.title="编辑";del.title="删除";e.onclick=()=>openModal(r);del.onclick=()=>remove(r);card.append(e,del);grid.append(card)});sec.append(grid);app.append(sec);const a=el("a","",title);a.href="#"+id;$("#toc").append(a)}}

async function load(){let {data,error}=await sb.from("pages_blocks").select("*").eq("page",PAGE);if(error){rows=DEFAULTS.map((d,i)=>({...d,id:"local-"+i}));draw();banner("Supabase 暂不可用：当前展示内置攻略，编辑暂不可用");return}
let v2=(data||[]).filter(r=>String(r.section||"").startsWith("v2:"));if(!v2.length){const {error:e}=await sb.from("pages_blocks").insert(DEFAULTS.map(d=>({page:PAGE,...d})));if(e){rows=DEFAULTS.map((d,i)=>({...d,id:"local-"+i}));draw();banner("初始化失败："+e.message);return}const q=await sb.from("pages_blocks").select("*").eq("page",PAGE);v2=(q.data||[]).filter(r=>String(r.section||"").startsWith("v2:"))}
rows=v2;draw();banner("实时同步已连接 · 新版内容分组独立保留，旧版数据未删除")}
async function refresh(){const q=await sb.from("pages_blocks").select("*").eq("page",PAGE);if(!q.error){rows=(q.data||[]).filter(r=>String(r.section||"").startsWith("v2:"));draw()}}
function openModal(r){editId=r?.id||null;const d=r?.data||{};$("#modalTitle").textContent=r?"编辑卡片":"添加卡片";$("#f_section").value=(r?.section||"v2:custom").replace(/^v2:/,"");$("#f_sectionTitle").value=d.sectionTitle||"";$("#f_title").value=d.title||"";$("#f_subtitle").value=d.subtitle||"";$("#f_tag").value=d.tag||"";$("#f_body").value=d.body||"";$("#f_note").value=d.note||"";$("#modal").classList.add("open")}
function openHero(d){openModal({id:heroId,section:"v2:hero",data:{sectionTitle:"首屏",title:d.title,subtitle:d.lead,tag:d.eyebrow,body:(d.facts||[]).map(x=>x.value+"｜"+x.label).join("\n")}});$("#modalTitle").textContent="编辑首屏重点"}
async function save(){const title=$("#f_title").value.trim();if(!title){alert("请填写标题");return}const sec=$("#f_section").value.trim()||"custom";const data={sectionTitle:$("#f_sectionTitle").value.trim(),title,subtitle:$("#f_subtitle").value.trim(),tag:$("#f_tag").value.trim(),body:$("#f_body").value,note:$("#f_note").value};const rec={page:PAGE,section:"v2:"+sec,sort:Date.now()%1000000,data};let q=editId?await sb.from("pages_blocks").update(rec).eq("id",editId):await sb.from("pages_blocks").insert(rec);if(q.error){alert("保存失败："+q.error.message);return}$("#modal").classList.remove("open");await refresh()}
async function remove(r){if(!confirm("删除这张新版卡片？旧版数据不受影响。"))return;const q=await sb.from("pages_blocks").delete().eq("id",r.id);if(q.error){alert(q.error.message);return}await refresh()}
$("#editToggle").onclick=()=>{document.body.classList.toggle("editing");$("#editToggle").textContent=document.body.classList.contains("editing")?"完成编辑":"编辑";draw()};
$("#addBtn").onclick=()=>openModal(null);$("#cancel").onclick=()=>$("#modal").classList.remove("open");$("#save").onclick=save;$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(rows,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=PAGE+"-v2.json";a.click()};
sb.channel("blocks-"+PAGE+"-v2").on("postgres_changes",{event:"*",schema:"public",table:"pages_blocks"},refresh).subscribe();load();
})();
</script></body></html>

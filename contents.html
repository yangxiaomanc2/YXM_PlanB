<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YXM Plan B · 行程与榜单</title>
<meta name="description" content="下一篇章，从这里开始。">
<style>
:root{--bg:#faf9f5;--surface:#ffffff;--ink:#141413;--muted:#6b6a65;--line:#e8e6dc;
--accent:#d97757;--soft:#f0eee6;
--serif:"Tiempos Headline",Georgia,"Songti SC","Noto Serif SC",serif;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.7;
-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.bar{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;
background:var(--bg);border-bottom:1px solid var(--line)}
.bar .site{font-family:var(--serif);font-size:16px;color:var(--ink)}
.bar .site:hover{text-decoration:none}
.hero{padding-top:88px}
.hero h1{font-family:var(--serif);font-weight:500;letter-spacing:-.025em;
font-size:clamp(36px,6vw,72px);line-height:1.1;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:48px}
.card{display:flex;flex-direction:column;background:var(--surface);
border:1px solid var(--line);border-radius:16px;padding:24px;color:inherit}
.card:hover{border-color:var(--ink);text-decoration:none}
.card .tg{align-self:flex-start;font-size:12px;color:var(--muted);background:var(--soft);
border-radius:999px;padding:3px 10px;margin-bottom:12px}
.card h2{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.35}
.card .st{font-size:13px;color:var(--muted);margin-top:4px}
.card p{font-size:14px;color:#3f3e3a;margin-top:12px}
.card .go{margin-top:auto;padding-top:16px;font-size:13px;color:var(--accent)}
footer.wrap{border-top:1px solid var(--line);margin-top:64px;padding-block:20px 40px;
color:var(--muted);font-size:12.5px}
@media(max-width:600px){.wrap{padding-inline:18px}.hero{padding-top:56px}
.grid{grid-template-columns:1fr;margin-top:32px}}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="site" href="./">YXM Plan B</a></div></header>

<main class="wrap">
  <div class="hero">
    <h1>行程与榜单</h1>
  </div>
  <div class="grid">
    <a class="card" href="./changbaishan-ski/">
      <span class="tg">行程攻略</span>
      <h2>上海 → 长白山滑雪 5 天</h2>
      <div class="st">11/12 晚出发 · 沈阳中转 · 华美胜地</div>
      <p>逐日时间线、交通班次、天气穿衣、美食与打包清单，含漂流停开时的备选方案。</p>
      <div class="go">查看攻略 →</div>
    </a>
    <a class="card" href="./china-ski-guide/"><span class="tg">滑雪全指南</span><h2>中国滑雪场与冬日旅行攻略</h2><div class="st">雪场参考 · 雪季日历 · 装备成长 · 多日路线</div><p>合并全国重点雪场参考与目的地旅行攻略，从第一次上雪道到追逐粉雪，附上海出发行程、装备、安全和当季雪况提示。</p><div class="go">循着雪线，开始旅程 →</div></a>
  </div>
</main>

<footer class="wrap">
  <p>YXM Plan B · GitHub Pages 托管</p>
</footer>
</body>
</html>

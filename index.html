<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YXM Plan B · 旅行攻略空间</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#0f2440;background:#f4f8fd;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
.hero{color:#fff;background:linear-gradient(135deg,#0d2b54,#1b5fb0 55%,#3f93dd);padding:60px 20px 54px;text-align:center}
.hero .tag{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  padding:5px 16px;border-radius:30px;font-size:13px;letter-spacing:2px;margin-bottom:18px}
.hero h1{font-size:40px;font-weight:800;letter-spacing:1px}
.hero p{margin-top:12px;font-size:15px;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:38px 20px 60px}
.sec-t{font-size:15px;color:#7489a3;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.trip{display:block;background:#fff;border:1px solid #e4edf6;border-radius:18px;overflow:hidden;
  box-shadow:0 6px 24px rgba(20,60,110,.10);text-decoration:none;color:inherit;transition:.22s}
.trip:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,60,110,.18)}
.trip .top{background:linear-gradient(120deg,#1b5fb0,#3f93dd);color:#fff;padding:22px 20px}
.trip .top .ico{font-size:30px}
.trip .top h2{font-size:20px;font-weight:800;margin-top:8px}
.trip .top span{font-size:13px;opacity:.9}
.trip .body{padding:16px 20px}
.trip .body p{font-size:13.5px;color:#38506f}
.trip .body .go{margin-top:12px;font-size:13px;font-weight:700;color:#1b5fb0}
.empty{background:#fff;border:1px dashed #cfe1fa;border-radius:16px;padding:22px;color:#7489a3;font-size:14px;text-align:center}
footer{text-align:center;color:#7489a3;font-size:12.5px;padding:0 20px 40px}
@media(max-width:600px){.hero h1{font-size:30px}}
</style>
</head>
<body>
<header class="hero">
  <span class="tag">TRAVEL PLANS</span>
  <h1>YXM Plan B</h1>
  <p>我的旅行攻略空间 · 每次行程一个独立页面</p>
</header>
<main class="wrap">
  <div class="sec-t">行程列表</div>
  <div class="cards">
    <a class="trip" href="./changbaishan-ski/">
      <div class="top">
        <div class="ico">🎿</div>
        <h2>长白山滑雪之旅</h2>
        <span>2026/11/12 – 11/17 · 上海→沈阳→长白山</span>
      </div>
      <div class="body">
        <p>5天4夜：沈阳中转一日游，华美胜地滑雪 2 天，温泉 + 娱雪，含逐日时间线、交通、美食与打包清单。</p>
        <div class="go">查看攻略 →</div>
      </div>
    </a>
  </div>
  <p class="empty" style="margin-top:18px">更多行程陆续加入这个空间…</p>
</main>
<footer>YXM Plan B · 由 GitHub Pages 托管 · 可随时更新</footer>
</body>
</html>

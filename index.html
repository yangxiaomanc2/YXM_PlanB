<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YXM Plan B</title>
<meta name="description" content="下一篇章，从这里开始。">
<style>
  :root {
    --bg: #faf9f5;
    --ink: #141413;
    --accent: #a54830;
    --accent-hover: #873a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  main {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(24px, 6vw, 96px);
    text-align: center;
  }
  h1 {
    max-width: 22ch;
    margin: 0;
    font: 400 clamp(2.5rem, 7.5vw, 7rem)/1.03 Georgia, "Songti SC", "Noto Serif SC", serif;
    letter-spacing: -.045em;
    text-wrap: balance;
  }
  .translation {
    display: block;
    margin-top: .9em;
    font-size: clamp(1.125rem, 2.7vw, 2rem);
    line-height: 1.5;
    letter-spacing: .02em;
  }
  .enter {
    display: inline-grid;
    place-items: center;
    min-height: 48px;
    margin-top: clamp(28px, 4.5vw, 52px);
    padding: 10px 30px;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font: 600 1rem/1.25 system-ui, sans-serif;
    text-decoration: none;
  }
  .enter:hover { background: var(--accent-hover); }
  .enter:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <div>
    <h1><span lang="en">Your Next Chapter Starts Here.</span><span class="translation">下一篇章，从这里开始。</span></h1>
    <a class="enter" href="./contents.html">进入</a>
  </div>
</main>
</body>
</html>

const DEFAULTS=[{"section":"v2:hero","sort":0,"data":{"eyebrow":"中国观星旅行 · 暗夜目的地 · 全年天象","title":"把一晚留给星空","lead":"从长三角周末暗夜到青海、新疆与西藏的深空远行，用地点、季节、月相和天气规划真正值得出发的观星之旅。","facts":[{"label":"全国重点区域","value":"18+"},{"label":"银河核心窗口","value":"5—8 月"},{"label":"流星雨重点","value":"8 月 / 12 月"},{"label":"暗适应时间","value":"20–30 分钟"}]}},{"section":"v2:start","sort":100,"data":{"sectionTitle":"先给结论：怎么选","title":"第一次观星，从华东近郊开始","subtitle":"上海出发 · 低门槛","tag":"入门","body":"优先看江苏盐城大丰、盱眙天泉湖、浙江开化等地。先确认夜间开放、活动安排和住宿，再选新月附近的晴夜。不要第一次就把行程押在高海拔或偏远无人区。","note":"把交通和安全放在“暗夜等级”之前。"}},{"section":"v2:start","sort":110,"data":{"sectionTitle":"先给结论：怎么选","title":"想看银河核心，优先西北","subtitle":"5—9 月 · 重点 6—8 月","tag":"银河","body":"青海茶卡、柴达木盆地周边、宁夏中卫、内蒙古腾格里和新疆戈壁更适合安排银河主题旅行。挑无月或弱月光窗口，尽量预留两到三晚，提高遇到晴夜的概率。","note":"银河核心在春季多为后半夜，夏季夜间窗口更友好。"}},{"section":"v2:start","sort":120,"data":{"sectionTitle":"先给结论：怎么选","title":"想要极致暗夜与深空摄影","subtitle":"青海冷湖及周边","tag":"进阶","body":"冷湖及柴达木盆地具有突出的暗夜环境和天文观测选址价值，适合星野与深空摄影。科研台址不等于公众景区，不能把进入科研设施或使用科研望远镜当作默认行程。","note":"只安排合法开放区域；偏远路段优先正规向导和车队。"}},{"section":"v2:start","sort":130,"data":{"sectionTitle":"先给结论：怎么选","title":"想看行星，不必追极暗夜","subtitle":"木星 / 土星 / 月球","tag":"望远镜","body":"行星更看重目标高度、空气稳定度（视宁度）和无遮挡视野。每年木星、土星的冲日与可见时段都会变化，出发前用 Stellarium 查当年时间，不要固定按月份套用。","note":"满月附近仍可看明亮行星和月面。"}},{"section":"v2:destinations","sort":200,"data":{"sectionTitle":"全国目的地：按区域选","title":"青海 · 茶卡盐湖","subtitle":"盐湖倒影 · 银河星野","tag":"西北","body":"5—9 月可重点考虑，兼顾盐湖、开阔地平线和银河摄影。倒影效果取决于水面、风力、降雨和夜间开放政策，不保证每晚都有镜面。","note":"海拔约 3,000 米；确认景区夜间入园与住宿接驳。"}},{"section":"v2:destinations","sort":210,"data":{"sectionTitle":"全国目的地：按区域选","title":"青海 · 冷湖 / 柴达木盆地","subtitle":"暗夜环境 · 深空摄影","tag":"西北进阶","body":"干燥、远离城市灯光的环境有利于暗夜观测，可安排 2—4 晚星空摄影。适合有摄影经验、能接受长距离转场的人。","note":"赛什腾山科研观测设施不等于公众开放；不要擅自进入。"}},{"section":"v2:destinations","sort":220,"data":{"sectionTitle":"全国目的地：按区域选","title":"青海 · 祁连 / 八宝镇","subtitle":"雪山草原 · 星空前景","tag":"西北","body":"适合把祁连山、草原和星空摄影结合，夏秋旅行舒适度相对较好。高海拔夜晚降温快，建议住在有正规接待和稳定交通的地点。","note":"山区云雾和道路状况变化快，至少留出天气缓冲。"}},{"section":"v2:destinations","sort":230,"data":{"sectionTitle":"全国目的地：按区域选","title":"宁夏 · 中卫沙坡头","subtitle":"沙漠体验 · 配套较成熟","tag":"西北入门","body":"沙漠营地、住宿和旅游服务便于组合，适合 1—2 晚观星加沙漠体验。5—10 月可择晴夜，夏季重点关注月相。","note":"确认营地是否允许夜间观测、是否有强照明和活动噪声。"}},{"section":"v2:destinations","sort":240,"data":{"sectionTitle":"全国目的地：按区域选","title":"内蒙古 · 腾格里沙漠","subtitle":"荒漠暗夜 · 露营星空","tag":"西北","body":"远离城市灯光的沙漠环境适合银河、星轨和流星雨主题旅行。建议选择正规营地和有经验的司机，不建议夜间自行穿越沙漠。","note":"风沙、昼夜温差、低温和车辆陷沙风险不可忽略。"}},{"section":"v2:destinations","sort":250,"data":{"sectionTitle":"全国目的地：按区域选","title":"新疆 · 哈密大海道","subtitle":"雅丹地貌 · 戈壁银河","tag":"西北进阶","body":"雅丹地貌为星空摄影提供独特前景，适合 5—9 月择晴夜安排。路线偏远，宜与正规旅行团队、熟悉地形的向导同行。","note":"确认景区开放、车辆许可、补给、通信和返程时间。"}},{"section":"v2:destinations","sort":260,"data":{"sectionTitle":"全国目的地：按区域选","title":"新疆 · 阿勒泰 / 喀纳斯周边","subtitle":"雪山森林 · 星空与冬季旅行","tag":"西北","body":"可结合阿勒泰、禾木、喀纳斯旅行安排星空摄影；但冬季低温、积雪、云量和道路限制会压缩观测窗口。","note":"不把滑雪季的积雪景观等同于稳定晴夜。"}},{"section":"v2:destinations","sort":270,"data":{"sectionTitle":"全国目的地：按区域选","title":"四川 · 牛背山 / 雅拉雪山周边","subtitle":"高山云海 · 雪山星空","tag":"西南","body":"适合拍摄山脊、云海与星空前景，秋冬晴夜可重点关注。山地天气变化快，云海与晴空未必同时出现。","note":"高海拔、强风、低温及景区交通以当地公告为准。"}},{"section":"v2:destinations","sort":280,"data":{"sectionTitle":"全国目的地：按区域选","title":"陕西 · 留坝火烧店","subtitle":"秦岭乡村 · 科普研学","tag":"华中近郊","body":"适合把观星、乡村住宿和自然教育结合，秋冬晴夜可关注；夏季也有银河机会。","note":"山谷云雾、林木遮挡与夜间道路需要提前确认。"}},{"section":"v2:destinations","sort":290,"data":{"sectionTitle":"全国目的地：按区域选","title":"江苏 · 盐城大丰野鹿荡","subtitle":"华东暗夜 · 湿地生态","tag":"长三角","body":"适合上海出发周末观星、流星雨主题活动和科普体验。建议优先报名有组织的活动，不默认保护地全年允许通宵、露营或自由架设器材。","note":"先问清开放区域、预约、住宿、活动日期和夜间照明管理。"}},{"section":"v2:destinations","sort":300,"data":{"sectionTitle":"全国目的地：按区域选","title":"江苏 · 盱眙天泉湖","subtitle":"天文科普 · 亲子与入门","tag":"长三角","body":"可关注夏季银河、英仙座流星雨及天文科普活动。适合初学者参加导师带领的望远镜体验。","note":"紫金山天文台观测站不等于全年公众开放，活动以主办方公告为准。"}},{"section":"v2:destinations","sort":310,"data":{"sectionTitle":"全国目的地：按区域选","title":"浙江 · 衢州开化长虹乡","subtitle":"乡村暗夜 · 2—3 天游","tag":"长三角","body":"适合长三角自驾或公共交通组合的乡村星空旅行，建议预留两晚，避免单晚遇云即全程落空。","note":"山地云雾和道路状况会造成局地差异，确认住宿与合法观测点。"}},{"section":"v2:destinations","sort":320,"data":{"sectionTitle":"全国目的地：按区域选","title":"深圳 · 西涌国际暗夜社区","subtitle":"海滨暗夜 · 华南周末","tag":"华南","body":"远离深圳中心城区，适合海边星空与暗夜体验。秋冬相对适合择晴夜，夏季需特别关注台风、强对流和高湿度。","note":"注意潮汐、海边暗礁、回撤路线与海风。"}},{"section":"v2:destinations","sort":330,"data":{"sectionTitle":"全国目的地：按区域选","title":"海南 · 文昌木兰湾","subtitle":"海岸线 · 星空摄影","tag":"华南","body":"可把海边星空与文昌航天主题旅行结合，秋冬晴夜可重点关注。海平线视野开阔，但海雾和云层会影响透明度。","note":"台风季、雷雨大风及海边夜间安全优先于拍摄计划。"}},{"section":"v2:destinations","sort":340,"data":{"sectionTitle":"全国目的地：按区域选","title":"西藏 · 阿里暗夜区域","subtitle":"高原暗夜 · 进阶摄影","tag":"高原进阶","body":"低光污染、高海拔环境适合有经验的星野摄影者。建议与阿里环线或正规团队组合，不建议专程短途仓促上高原。","note":"海拔高、医疗与补给距离远；预留适应时间，身体不适立即停止观测。"}},{"section":"v2:destinations","sort":350,"data":{"sectionTitle":"全国目的地：按区域选","title":"西藏 · 那曲及周边","subtitle":"草原湖泊 · 高原星空","tag":"高原进阶","body":"草原、湖泊与雪山可形成丰富星空前景，适合有高原旅行经验的人。","note":"高海拔、低温、风和偏远交通叠加，优先考虑正规住宿与通信保障。"}},{"section":"v2:destinations","sort":360,"data":{"sectionTitle":"全国目的地：按区域选","title":"重庆 · 武隆罩云山","subtitle":"山地暗夜 · 城市周边延伸","tag":"西南","body":"可作为重庆周边山地观星候选，适合秋冬择晴夜与自然旅行组合。","note":"山雾、降雨、湿滑山路风险较高，确认夜间通行。"}},{"section":"v2:destinations","sort":370,"data":{"sectionTitle":"全国目的地：按区域选","title":"辽宁 · 桓仁五女山","subtitle":"山地星空 · 东北旅行","tag":"东北","body":"可结合东北秋季山地旅行安排晴夜观测，重点看云量、能见度和山顶视野。","note":"夏季降水与雾气可能较多，选择合法开放的观景区域。"}},{"section":"v2:calendar","sort":300,"data":{"sectionTitle":"全年观星日历","title":"春季 · 3—5 月","subtitle":"银河核心开始进入后半夜","tag":"季节","body":"关注春季星座、球状星团；银河核心逐渐在黎明前出现。适合能接受后半夜观测的人。","note":"优先看低云、透明度和月亮落下时间。"}},{"section":"v2:calendar","sort":310,"data":{"sectionTitle":"全年观星日历","title":"夏季 · 6—8 月","subtitle":"银河核心黄金窗口","tag":"季节","body":"银河核心夜间可见时间更长，适合青海、宁夏、内蒙古、新疆等地。8 月中旬通常关注英仙座流星雨极大。","note":"华东、华南要防梅雨、强对流和台风。"}},{"section":"v2:calendar","sort":320,"data":{"sectionTitle":"全年观星日历","title":"秋季 · 9—11 月","subtitle":"秋季暗夜与仙女座星系","tag":"季节","body":"适合 M31 仙女座星系、秋季星座和银河尾段；西北部分地区可能有较好的透明度。","note":"山区夜间降温明显，备防风保暖层。"}},{"section":"v2:calendar","sort":330,"data":{"sectionTitle":"全年观星日历","title":"冬季 · 12—2 月","subtitle":"猎户座、昴星团与双子座流星雨","tag":"季节","body":"M42 猎户座大星云、M45 昴星团适合双筒或望远镜；12 月中旬关注双子座流星雨。","note":"寒冷、风和结露是设备与体感的主要挑战。"}},{"section":"v2:calendar","sort":340,"data":{"sectionTitle":"全年观星日历","title":"每月月相窗口","subtitle":"新月前后约 5—7 天优先","tag":"月相","body":"深空和银河目标尽量避开月光强的时段；不只看新月日期，还要查月亮升落时刻。","note":"月出后天空亮度会明显上升，满月附近改看行星和月面。"}},{"section":"v2:calendar","sort":350,"data":{"sectionTitle":"全年观星日历","title":"流星雨观测","subtitle":"英仙座 8 月 / 双子座 12 月","tag":"流星雨","body":"流星雨不需要望远镜。选择开阔天空，躺椅或防潮垫比持续盯着手机更实用。","note":"每年重新核对极大时刻、月相与辐射点高度，ZHR 不等于肉眼实际数量。"}},{"section":"v2:targets","sort":400,"data":{"sectionTitle":"看什么：银河、行星与深空","title":"银河核心","subtitle":"大致 5—8 月，时段随纬度变化","tag":"银河","body":"裸眼、广角相机或双筒都可。暗夜、无月或弱月光、低云少、远离城市灯光是关键。春季通常要等到后半夜。","note":"不应把“夏季”当成每晚都能看到银河的保证。"}},{"section":"v2:targets","sort":410,"data":{"sectionTitle":"看什么：银河、行星与深空","title":"木星与土星","subtitle":"每年可见时段变化","tag":"行星","body":"用 Stellarium 查询当年冲日日期、日落后高度与升落时间。行星观测更看重视宁度和高度，不必一定去荒漠。","note":"行星位置每年变化，不要把旧攻略里的月份照搬。"}},{"section":"v2:targets","sort":420,"data":{"sectionTitle":"看什么：银河、行星与深空","title":"M42 猎户座大星云","subtitle":"北半球秋冬至早春","tag":"深空","body":"明亮、适合双筒和望远镜入门；在暗夜中结构更明显，城市边缘也可尝试。","note":"选择天体高度较高、月光较弱的时段。"}},{"section":"v2:targets","sort":430,"data":{"sectionTitle":"看什么：银河、行星与深空","title":"M45 昴星团","subtitle":"秋冬","tag":"深空","body":"裸眼可见，双筒能呈现更丰富的星团视野；不适合用过高倍率。","note":"视野开阔、低倍率更重要。"}},{"section":"v2:targets","sort":440,"data":{"sectionTitle":"看什么：银河、行星与深空","title":"M31 仙女座星系","subtitle":"夏末至秋季","tag":"深空","body":"在极暗夜可尝试裸眼辨认，双筒更容易找到；望远镜低倍率观察更友好。","note":"暗夜和透明度比单纯放大倍率更重要。"}},{"section":"v2:targets","sort":450,"data":{"sectionTitle":"看什么：银河、行星与深空","title":"英仙座 / 双子座流星雨","subtitle":"通常 8 月中旬 / 12 月中旬","tag":"流星雨","body":"不需要任何光学设备，视线放松观察大片天空，连续停留至少一小时更有机会。","note":"实际可见数量受月光、云量、光污染和辐射点高度影响。"}},{"section":"v2:conditions","sort":500,"data":{"sectionTitle":"怎样挑中一晚好天气","title":"先看月亮，不要只看新月标签","subtitle":"查月出、月落和天文暮光","tag":"月相","body":"银河和暗弱深空优先新月前后；若月亮前半夜落下，后半夜仍可能有暗夜窗口。","note":"用 Time and Date 查询月升月落和天文暮光。"}},{"section":"v2:conditions","sort":510,"data":{"sectionTitle":"怎样挑中一晚好天气","title":"云量、能见度、湿度和风","subtitle":"出发前 24—48 小时复查","tag":"天气","body":"重点看低云量、总云量、降水、能见度、大气透明度、湿度、露点和阵风。薄高云也会影响银河对比度。","note":"遇雷雨、强对流、大风或能见度骤降，取消户外观测。"}},{"section":"v2:conditions","sort":520,"data":{"sectionTitle":"怎样挑中一晚好天气","title":"光污染与暗适应","subtitle":"选合法开放的暗夜地点","tag":"暗夜","body":"用光污染地图初筛，避开城市、道路和景区强灯。到场后减少白光和手机亮度，给眼睛 20—30 分钟暗适应。","note":"地图只是初筛，不能替代现场勘察和管理方许可。"}},{"section":"v2:conditions","sort":530,"data":{"sectionTitle":"怎样挑中一晚好天气","title":"多晚比单晚更稳妥","subtitle":"远途至少预留 2—3 晚","tag":"行程","body":"观星旅行最大不确定性是云量。长途飞行或高原行程尽量多留一晚，降低单晚天气失败的风险。","note":"预订前了解天气原因取消、改期和退款规则。"}},{"section":"v2:gear","sort":600,"data":{"sectionTitle":"装备与活动怎么选","title":"裸眼与双筒","subtitle":"第一次观星的高性价比组合","tag":"器材","body":"裸眼看银河、星座和流星雨；7×50 或 10×50 双筒适合星团和银河星野。先学认星、找方向，再考虑大口径望远镜。","note":"双筒也需要稳定握持；不要盲目追求高倍率。"}},{"section":"v2:gear","sort":610,"data":{"sectionTitle":"装备与活动怎么选","title":"150—200 mm 望远镜","subtitle":"月球、木星、土星与明亮深空","tag":"器材","body":"牛顿反射望远镜集光能力较好，适合进阶目视；同时要考虑架台稳定、调焦、寻星、准直和搬运。","note":"设备越大不一定越适合旅行，重量和安装时间要纳入计划。"}},{"section":"v2:gear","sort":620,"data":{"sectionTitle":"装备与活动怎么选","title":"报名现场观测活动","subtitle":"确认能亲自操作，不只是排队看","tag":"活动","body":"问清是否有导师、设备口径与数量、目标天体、是否能亲自寻星调焦、两人能否报名，以及天气取消改期政策。","note":"“现场有望远镜”不等于能由参与者独立操作。"}},{"section":"v2:gear","sort":630,"data":{"sectionTitle":"装备与活动怎么选","title":"夜间拍摄装备","subtitle":"保暖、红光、供电与防露","tag":"摄影","body":"带三脚架、备用电池、充电宝、红光灯、防潮袋、镜头防露措施和离线星图。冬季电池低温衰减明显。","note":"不要为拍摄离开开放道路或进入保护区禁入区域。"}},{"section":"v2:routes","sort":700,"data":{"sectionTitle":"从上海出发：华东与远途组合","title":"周末 2 天 1 夜 · 盐城 / 盱眙","subtitle":"低门槛观星体验","tag":"上海出发","body":"先核对活动日历和夜间开放；白天抵达、入住，晚间参加组织活动，第二天安排湿地或湖区日间游览。","note":"若没有正式夜间开放或活动，别把景区白天门票当作夜间入场许可。"}},{"section":"v2:routes","sort":710,"data":{"sectionTitle":"从上海出发：华东与远途组合","title":"周末 3 天 2 夜 · 开化乡村","subtitle":"长三角暗夜与慢旅行","tag":"上海出发","body":"第一天抵达并熟悉住宿周边；第二天白天轻徒步，晚上观星；第三天返程。建议安排两晚，提升遇到晴夜概率。","note":"自驾夜间山路要控制驾驶疲劳，提前确认停车点和合法观测点。"}},{"section":"v2:routes","sort":720,"data":{"sectionTitle":"从上海出发：华东与远途组合","title":"4—5 天 · 宁夏中卫 / 腾格里","subtitle":"沙漠与银河组合","tag":"西北旅行","body":"飞抵银川或中卫后按当地交通衔接沙漠营地，安排 2—3 晚，白天沙漠体验、夜间观星。","note":"营地照明、夜间噪声、车辆接驳和天气取消政策需提前问清。"}},{"section":"v2:routes","sort":730,"data":{"sectionTitle":"从上海出发：华东与远途组合","title":"5—7 天 · 青海茶卡 / 冷湖周边","subtitle":"盐湖与暗夜摄影","tag":"西北进阶","body":"把茶卡盐湖和柴达木盆地分段安排，避免每天长距离赶路；在暗夜地点至少留两晚。","note":"高海拔、长距离驾驶、油料补给和夜间道路安全必须优先规划。"}},{"section":"v2:routes","sort":740,"data":{"sectionTitle":"从上海出发：华东与远途组合","title":"5—7 天 · 新疆哈密大海道","subtitle":"雅丹地貌与戈壁星空","tag":"西北进阶","body":"建议正规团队组织，白天完成转场和地貌游览，夜间在许可区域拍摄；保留天气与车辆机动时间。","note":"不建议无经验者夜间独自穿越无人区。"}},{"section":"v2:safety","sort":800,"data":{"sectionTitle":"安全、环保与资料工具","title":"夜间安全清单","subtitle":"结伴、保暖、照明、通信与返程","tag":"安全","body":"提前告知亲友路线和返程时间；带保暖层、饮水、食物、备用电源、红光手电和离线地图；远离悬崖、水边和未开放区域。","note":"高原不适、雷雨、大风、强对流或道路结冰时停止观测。"}},{"section":"v2:safety","sort":810,"data":{"sectionTitle":"安全、环保与资料工具","title":"生态与场地规则","subtitle":"不擅自露营、入保护区或进科研台址","tag":"环保","body":"湿地、草原、林地、自然保护区和科研设施都有管理边界。遵守预约、夜间通行、停车和照明规定，不生火、不留垃圾、不破坏植被。","note":"入选观星推荐区域不代表可自由通宵或架设设备。"}},{"section":"v2:safety","sort":820,"data":{"sectionTitle":"安全、环保与资料工具","title":"观测规划工具","subtitle":"光污染 / 星图 / 月相 / 天气","tag":"工具","body":"Light Pollution Map：查看人工光污染；Stellarium：查星体位置；Time and Date：查月相与暮光；中国天气网：看天气预警和逐小时预报。","note":"工具链接见页面底部，临出发仍需核实当地公告。"}},{"section":"v2:safety","sort":830,"data":{"sectionTitle":"安全、环保与资料工具","title":"资料边界","subtitle":"推荐地点不是晴夜保证","tag":"说明","body":"本攻略综合暗夜潜力、旅行可达性与观测目标，不是统一标准的全年暗夜排名。开放时间、交通、活动、门票和天气均会变化。","note":"2026 暑期观星指南是暑期适宜区域评估，不能误读为全年最佳地点榜单。"}}];const $=s=>document.querySelector(s),app=$("#app");let rows=[],editId=null,heroId=null;
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function drawHero(d){const h=$("#hero");h.replaceChildren();h.append(el("div","eyebrow",d.eyebrow||"YXM PLAN B"));h.append(el("h1","",d.title||"旅行攻略"));h.append(el("p","lead",d.lead||""));const facts=el("div","facts");(d.facts||[]).forEach(f=>{const x=el("div","fact"),v=el("div","v",f.value),l=el("div","l",f.label);x.append(v,l);facts.append(x)});h.append(facts);const edit=el("button","btn","编辑首屏");edit.style.display=document.body.classList.contains("editing")?"inline-block":"none";edit.onclick=()=>openHero(d);h.append(edit)}
function draw(){const h=rows.find(r=>r.section==="v2:hero");heroId=h?.id||null;drawHero(h?.data||DEFAULTS[0].data);app.replaceChildren();$("#toc").replaceChildren();const sections=new Map();rows.filter(r=>r.section!=="v2:hero").sort((a,b)=>(a.sort||0)-(b.sort||0)).forEach(r=>{if(!sections.has(r.section))sections.set(r.section,[]);sections.get(r.section).push(r)});
let idx=0;for(const [key,list] of sections){const id="section-"+idx++,sec=el("section","sec");sec.id=id;const title=list[0]?.data?.sectionTitle||key.replace("v2:","");sec.append(el("h2","",title));const grid=el("div","grid");list.forEach(r=>{const d=r.data||{},card=el("article","card");if(d.tag)card.append(el("span","tag",d.tag));card.append(el("h3","",d.title||"未命名"));if(d.subtitle)card.append(el("p","sub",d.subtitle));if(d.body)card.append(el("div","body",d.body));if(d.note)card.append(el("div","note",d.note));const e=el("button","edit","✎"),del=el("button","del","×");e.title="编辑";del.title="删除";e.onclick=()=>openModal(r);del.onclick=()=>remove(r);card.append(e,del);grid.append(card)});sec.append(grid);app.append(sec);const a=el("a","",title);a.href="#"+id;$("#toc").append(a)}}
function banner(t){$("#sync").textContent=t}
async function load(){let {data,error}=await sb.from("pages_blocks").select("*").eq("page",PAGE);if(error){rows=DEFAULTS.map((d,i)=>({...d,id:"local-"+i}));draw();banner("Supabase 暂不可用：当前展示内置攻略，编辑暂不可用");return}
let v2=(data||[]).filter(r=>String(r.section||"").startsWith("v2:"));if(!v2.length){const {error:e}=await sb.from("pages_blocks").insert(DEFAULTS.map(d=>({page:PAGE,...d})));if(e){rows=DEFAULTS.map((d,i)=>({...d,id:"local-"+i}));draw();banner("初始化失败："+e.message);return}const q=await sb.from("pages_blocks").select("*").eq("page",PAGE);v2=(q.data||[]).filter(r=>String(r.section||"").startsWith("v2:"))}
rows=v2;draw();banner("实时同步已连接 · 新版内容分组独立保留，旧版数据未删除")}
async function refresh(){const q=await sb.from("pages_blocks").select("*").eq("page",PAGE);if(!q.error){rows=(q.data||[]).filter(r=>String(r.section||"").startsWith("v2:"));draw()}}
function openModal(r){editId=r?.id||null;const d=r?.data||{};$("#modalTitle").textContent=r?"编辑卡片":"添加卡片";$("#f_section").value=(r?.section||"v2:custom").replace(/^v2:/,"");$("#f_sectionTitle").value=d.sectionTitle||"";$("#f_title").value=d.title||"";$("#f_subtitle").value=d.subtitle||"";$("#f_tag").value=d.tag||"";$("#f_body").value=d.body||"";$("#f_note").value=d.note||"";$("#modal").classList.add("open")}
function openHero(d){openModal({id:heroId,section:"v2:hero",data:{sectionTitle:"首屏",title:d.title,subtitle:d.lead,tag:d.eyebrow,body:(d.facts||[]).map(x=>x.value+"｜"+x.label).join("\n")}});$("#modalTitle").textContent="编辑首屏重点"}
async function save(){const title=$("#f_title").value.trim();if(!title){alert("请填写标题");return}const sec=$("#f_section").value.trim()||"custom";const data={sectionTitle:$("#f_sectionTitle").value.trim(),title,subtitle:$("#f_subtitle").value.trim(),tag:$("#f_tag").value.trim(),body:$("#f_body").value,note:$("#f_note").value};const rec={page:PAGE,section:"v2:"+sec,sort:Date.now()%1000000,data};let q=editId?await sb.from("pages_blocks").update(rec).eq("id",editId):await sb.from("pages_blocks").insert(rec);if(q.error){alert("保存失败："+q.error.message);return}$("#modal").classList.remove("open");await refresh()}
async function remove(r){if(!confirm("删除这张新版卡片？旧版数据不受影响。"))return;const q=await sb.from("pages_blocks").delete().eq("id",r.id);if(q.error){alert(q.error.message);return}await refresh()}
$("#editToggle").onclick=()=>{document.body.classList.toggle("editing");$("#editToggle").textContent=document.body.classList.contains("editing")?"完成编辑":"编辑";draw()};
$("#addBtn").onclick=()=>openModal(null);$("#cancel").onclick=()=>$("#modal").classList.remove("open");$("#save").onclick=save;$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(rows,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=PAGE+"-v2.json";a.click()};
sb.channel("blocks-"+PAGE+"-v2").on("postgres_changes",{event:"*",schema:"public",table:"pages_blocks"},refresh).subscribe();load();
})();

留出天气缓冲。"}},{"section":"v2:destinations","sort":230,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"宁夏 · 中卫沙坡头","subtitle":"沙漠体验 · 配套较成熟","tag":"西北入门","body":"沙漠营地、住宿和旅游服务便于组合，适合 1—2 晚观星加沙漠体验。5—10 月可择晴夜，夏季重点关注月相。","note":"确认营地是否允许夜间观测、是否有强照明和活动噪声。"}},{"section":"v2:destinations","sort":240,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"内蒙古 · 腾格里沙漠","subtitle":"荒漠暗夜 · 露营星空","tag":"西北","body":"远离城市灯光的沙漠环境适合银河、星轨和流星雨主题旅行。建议选择正规营地和有经验的司机，不建议夜间自行穿越沙漠。","note":"风沙、昼夜温差、低温和车辆陷沙风险不可忽略。"}},{"section":"v2:destinations","sort":250,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"新疆 · 哈密大海道","subtitle":"雅丹地貌 · 戈壁银河","tag":"西北进阶","body":"雅丹地貌为星空摄影提供独特前景，适合 5—9 月择晴夜安排。路线偏远，宜与正规旅行团队、熟悉地形的向导同行。","note":"确认景区开放、车辆许可、补给、通信和返程时间。"}},{"section":"v2:destinations","sort":260,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"新疆 · 阿勒泰 / 喀纳斯周边","subtitle":"雪山森林 · 星空与冬季旅行","tag":"西北","body":"可结合阿勒泰、禾木、喀纳斯旅行安排星空摄影；但冬季低温、积雪、云量和道路限制会压缩观测窗口。","note":"不把滑雪季的积雪景观等同于稳定晴夜。"}},{"section":"v2:destinations","sort":270,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"四川 · 牛背山 / 雅拉雪山周边","subtitle":"高山云海 · 雪山星空","tag":"西南","body":"适合拍摄山脊、云海与星空前景，秋冬晴夜可重点关注。山地天气变化快，云海与晴空未必同时出现。","note":"高海拔、强风、低温及景区交通以当地公告为准。"}},{"section":"v2:destinations","sort":280,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"陕西 · 留坝火烧店","subtitle":"秦岭乡村 · 科普研学","tag":"华中近郊","body":"适合把观星、乡村住宿和自然教育结合，秋冬晴夜可关注；夏季也有银河机会。","note":"山谷云雾、林木遮挡与夜间道路需要提前确认。"}},{"section":"v2:destinations","sort":290,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"江苏 · 盐城大丰野鹿荡","subtitle":"华东暗夜 · 湿地生态","tag":"长三角","body":"适合上海出发周末观星、流星雨主题活动和科普体验。建议优先报名有组织的活动，不默认保护地全年允许通宵、露营或自由架设器材。","note":"先问清开放区域、预约、住宿、活动日期和夜间照明管理。"}},{"section":"v2:destinations","sort":300,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"江苏 · 盱眙天泉湖","subtitle":"天文科普 · 亲子与入门","tag":"长三角","body":"可关注夏季银河、英仙座流星雨及天文科普活动。适合初学者参加导师带领的望远镜体验。","note":"紫金山天文台观测站不等于全年公众开放，活动以主办方公告为准。"}},{"section":"v2:destinations","sort":310,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"浙江 · 衢州开化长虹乡","subtitle":"乡村暗夜 · 2—3 天游","tag":"长三角","body":"适合长三角自驾或公共交通组合的乡村星空旅行，建议预留两晚，避免单晚遇云即全程落空。","note":"山地云雾和道路状况会造成局地差异，确认住宿与合法观测点。"}},{"section":"v2:destinations","sort":320,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"深圳 · 西涌国际暗夜社区","subtitle":"海滨暗夜 · 华南周末","tag":"华南","body":"远离深圳中心城区，适合海边星空与暗夜体验。秋冬相对适合择晴夜，夏季需特别关注台风、强对流和高湿度。","note":"注意潮汐、海边暗礁、回撤路线与海风。"}},{"section":"v2:destinations","sort":330,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"海南 · 文昌木兰湾","subtitle":"海岸线 · 星空摄影","tag":"华南","body":"可把海边星空与文昌航天主题旅行结合，秋冬晴夜可重点关注。海平线视野开阔，但海雾和云层会影响透明度。","note":"台风季、雷雨大风及海边夜间安全优先于拍摄计划。"}},{"section":"v2:destinations","sort":340,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"西藏 · 阿里暗夜区域","subtitle":"高原暗夜 · 进阶摄影","tag":"高原进阶","body":"低光污染、高海拔环境适合有经验的星野摄影者。建议与阿里环线或正规团队组合，不建议专程短途仓促上高原。","note":"海拔高、医疗与补给距离远；预留适应时间，身体不适立即停止观测。"}},{"section":"v2:destinations","sort":350,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"西藏 · 那曲及周边","subtitle":"草原湖泊 · 高原星空","tag":"高原进阶","body":"草原、湖泊与雪山可形成丰富星空前景，适合有高原旅行经验的人。","note":"高海拔、低温、风和偏远交通叠加，优先考虑正规住宿与通信保障。"}},{"section":"v2:destinations","sort":360,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"重庆 · 武隆罩云山","subtitle":"山地暗夜 · 城市周边延伸","tag":"西南","body":"可作为重庆周边山地观星候选，适合秋冬择晴夜与自然旅行组合。","note":"山雾、降雨、湿滑山路风险较高，确认夜间通行。"}},{"section":"v2:destinations","sort":370,"data":{"sectionTitle":"人间山海，皆是观星之境","title":"辽宁 · 桓仁五女山","subtitle":"山地星空 · 东北旅行","tag":"东北","body":"可结合东北秋季山地旅行安排晴夜观测，重点看云量、能见度和山顶视野。","note":"夏季降水与雾气可能较多，选择合法开放的观景区域。"}},{"section":"v2:calendar","sort":300,"data":{"sectionTitle":"星移斗转，岁岁皆有银河","title":"春季 · 3—5 月","subtitle":"银河核心开始进入后半夜","tag":"季节","body":"关注春季星座、球状星团；银河核心逐渐在黎明前出现。适合能接受后半夜观测的人。","note":"优先看低云、透明度和月亮落下时间。"}},{"section":"v2:calendar","sort":310,"data":{"sectionTitle":"星移斗转，岁岁皆有银河","title":"夏季 · 6—8 月","subtitle":"银河核心黄金窗口","tag":"季节","body":"银河核心夜间可见时间更长，适合青海、宁夏、内蒙古、新疆等地。8 月中旬通常关注英仙座流星雨极大。","note":"华东、华南要防梅雨、强对流和台风。"}},{"section":"v2:calendar","sort":320,"data":{"sectionTitle":"星移斗转，岁岁皆有银河","title":"秋季 · 9—11 月","subtitle":"秋季暗夜与仙女座星系","tag":"季节","body":"适合 M31 仙女座星系、秋季星座和银河尾段；西北部分地区可能有较好的透明度。","note":"山区夜间降温明显，备防风保暖层。"}},{"section":"v2:calendar","sort":330,"data":{"sectionTitle":"星移斗转，岁岁皆有银河","title":"冬季 · 12—2 月","subtitle":"猎户座、昴星团与双子座流星雨","tag":"季节","body":"M42 猎户座大星云、M45 昴星团适合双筒或望远镜；12 月中旬关注双子座流星雨。","note":"寒冷、风和结露是设备与体感的主要挑战。"}},{"section":"v2:calendar","sort":340,"data":{"sectionTitle":"星移斗转，岁岁皆有银河","title":"每月月相窗口","subtitle":"新月前后约 5—7 天优先","tag":"月相","body":"深空和银河目标尽量避开月光强的时段；不只看新月日期，还要查月亮升落时刻。","note":"月出后天空亮度会明显上升，满月附近改看行星和月面。"}},{"section":"v2:calendar","sort":350,"data":{"sectionTitle":"星移斗转，岁岁皆有银河","title":"流星雨观测","subtitle":"英仙座 8 月 / 双子座 12 月","tag":"流星雨","body":"流星雨不需要望远镜。选择开阔天空，躺椅或防潮垫比持续盯着手机更实用。","note":"每年重新核对极大时刻、月相与辐射点高度，ZHR 不等于肉眼实际数量。"}},{"section":"v2:targets","sort":400,"data":{"sectionTitle":"穿越光年，凝望宇宙深处","title":"银河核心","subtitle":"大致 5—8 月，时段随纬度变化","tag":"银河","body":"裸眼、广角相机或双筒都可。暗夜、无月或弱月光、低云少、远离城市灯光是关键。春季通常要等到后半夜。","note":"不应把“夏季”当成每晚都能看到银河的保证。"}},{"section":"v2:targets","sort":410,"data":{"sectionTitle":"穿越光年，凝望宇宙深处","title":"木星与土星","subtitle":"每年可见时段变化","tag":"行星","body":"用 Stellarium 查询当年冲日日期、日落后高度与升落时间。行星观测更看重视宁度和高度，不必一定去荒漠。","note":"行星位置每年变化，不要把旧攻略里的月份照搬。"}},{"section":"v2:targets","sort":420,"data":{"sectionTitle":"穿越光年，凝望宇宙深处","title":"M42 猎户座大星云","subtitle":"北半球秋冬至早春","tag":"深空","body":"明亮、适合双筒和望远镜入门；在暗夜中结构更明显，城市边缘也可尝试。","note":"选择天体高度较高、月光较弱的时段。"}},{"section":"v2:targets","sort":430,"data":{"sectionTitle":"穿越光年，凝望宇宙深处","title":"M45 昴星团","subtitle":"秋冬","tag":"深空","body":"裸眼可见，双筒能呈现更丰富的星团视野；不适合用过高倍率。","note":"视野开阔、低倍率更重要。"}},{"section":"v2:targets","sort":440,"data":{"sectionTitle":"穿越光年，凝望宇宙深处","title":"M31 仙女座星系","subtitle":"夏末至秋季","tag":"深空","body":"在极暗夜可尝试裸眼辨认，双筒更容易找到；望远镜低倍率观察更友好。","note":"暗夜和透明度比单纯放大倍率更重要。"}},{"section":"v2:targets","sort":450,"data":{"sectionTitle":"穿越光年，凝望宇宙深处","title":"英仙座 / 双子座流星雨","subtitle":"通常 8 月中旬 / 12 月中旬","tag":"流星雨","body":"不需要任何光学设备，视线放松观察大片天空，连续停留至少一小时更有机会。","note":"实际可见数量受月光、云量、光污染和辐射点高度影响。"}},{"section":"v2:conditions","sort":500,"data":{"sectionTitle":"择一片晴空，候万千星辰","title":"先看月亮，不要只看新月标签","subtitle":"查月出、月落和天文暮光","tag":"月相","body":"银河和暗弱深空优先新月前后；若月亮前半夜落下，后半夜仍可能有暗夜窗口。","note":"用 Time and Date 查询月升月落和天文暮光。"}},{"section":"v2:conditions","sort":510,"data":{"sectionTitle":"择一片晴空，候万千星辰","title":"云量、能见度、湿度和风","subtitle":"出发前 24—48 小时复查","tag":"天气","body":"重点看低云量、总云量、降水、能见度、大气透明度、湿度、露点和阵风。薄高云也会影响银河对比度。","note":"遇雷雨、强对流、大风或能见度骤降，取消户外观测。"}},{"section":"v2:conditions","sort":520,"data":{"sectionTitle":"择一片晴空，候万千星辰","title":"光污染与暗适应","subtitle":"选合法开放的暗夜地点","tag":"暗夜","body":"用光污染地图初筛，避开城市、道路和景区强灯。到场后减少白光和手机亮度，给眼睛 20—30 分钟暗适应。","note":"地图只是初筛，不能替代现场勘察和管理方许可。"}},{"section":"v2:conditions","sort":530,"data":{"sectionTitle":"择一片晴空，候万千星辰","title":"多晚比单晚更稳妥","subtitle":"远途至少预留 2—3 晚","tag":"行程","body":"观星旅行最大不确定性是云量。长途飞行或高原行程尽量多留一晚，降低单晚天气失败的风险。","note":"预订前了解天气原因取消、改期和退款规则。"}},{"section":"v2:gear","sort":600,"data":{"sectionTitle":"以微光为伴，以好奇为舟","title":"裸眼与双筒","subtitle":"第一次观星的高性价比组合","tag":"器材","body":"裸眼看银河、星座和流星雨；7×50 或 10×50 双筒适合星团和银河星野。先学认星、找方向，再考虑大口径望远镜。","note":"双筒也需要稳定握持；不要盲目追求高倍率。"}},{"section":"v2:gear","sort":610,"data":{"sectionTitle":"以微光为伴，以好奇为舟","title":"150—200 mm 望远镜","subtitle":"月球、木星、土星与明亮深空","tag":"器材","body":"牛顿反射望远镜集光能力较好，适合进阶目视；同时要考虑架台稳定、调焦、寻星、准直和搬运。","note":"设备越大不一定越适合旅行，重量和安装时间要纳入计划。"}},{"section":"v2:gear","sort":620,"data":{"sectionTitle":"以微光为伴，以好奇为舟","title":"报名现场观测活动","subtitle":"确认能亲自操作，不只是排队看","tag":"活动","body":"问清是否有导师、设备口径与数量、目标天体、是否能亲自寻星调焦、两人能否报名，以及天气取消改期政策。","note":"“现场有望远镜”不等于能由参与者独立操作。"}},{"section":"v2:gear","sort":630,"data":{"sectionTitle":"以微光为伴，以好奇为舟","title":"夜间拍摄装备","subtitle":"保暖、红光、供电与防露","tag":"摄影","body":"带三脚架、备用电池、充电宝、红光灯、防潮袋、镜头防露措施和离线星图。冬季电池低温衰减明显。","note":"不要为拍摄离开开放道路或进入保护区禁入区域。"}},{"section":"v2:routes","sort":700,"data":{"sectionTitle":"循着星光，去往远方","title":"周末 2 天 1 夜 · 盐城 / 盱眙","subtitle":"低门槛观星体验","tag":"上海出发","body":"先核对活动日历和夜间开放；白天抵达、入住，晚间参加组织活动，第二天安排湿地或湖区日间游览。","note":"若没有正式夜间开放或活动，别把景区白天门票当作夜间入场许可。"}},{"section":"v2:routes","sort":710,"data":{"sectionTitle":"循着星光，去往远方","title":"周末 3 天 2 夜 · 开化乡村","subtitle":"长三角暗夜与慢旅行","tag":"上海出发","body":"第一天抵达并熟悉住宿周边；第二天白天轻徒步，晚上观星；第三天返程。建议安排两晚，提升遇到晴夜概率。","note":"自驾夜间山路要控制驾驶疲劳，提前确认停车点和合法观测点。"}},{"section":"v2:routes","sort":720,"data":{"sectionTitle":"循着星光，去往远方","title":"4—5 天 · 宁夏中卫 / 腾格里","subtitle":"沙漠与银河组合","tag":"西北旅行","body":"飞抵银川或中卫后按当地交通衔接沙漠营地，安排 2—3 晚，白天沙漠体验、夜间观星。","note":"营地照明、夜间噪声、车辆接驳和天气取消政策需提前问清。"}},{"section":"v2:routes","sort":730,"data":{"sectionTitle":"循着星光，去往远方","title":"5—7 天 · 青海茶卡 / 冷湖周边","subtitle":"盐湖与暗夜摄影","tag":"西北进阶","body":"把茶卡盐湖和柴达木盆地分段安排，避免每天长距离赶路；在暗夜地点至少留两晚。","note":"高海拔、长距离驾驶、油料补给和夜间道路安全必须优先规划。"}},{"section":"v2:routes","sort":740,"data":{"sectionTitle":"循着星光，去往远方","title":"5—7 天 · 新疆哈密大海道","subtitle":"雅丹地貌与戈壁星空","tag":"西北进阶","body":"建议正规团队组织，白天完成转场和地貌游览，夜间在许可区域拍摄；保留天气与车辆机动时间。","note":"不建议无经验者夜间独自穿越无人区。"}},{"section":"v2:safety","sort":800,"data":{"sectionTitle":"敬畏自然，珍藏每一片暗夜","title":"夜间安全清单","subtitle":"结伴、保暖、照明、通信与返程","tag":"安全","body":"提前告知亲友路线和返程时间；带保暖层、饮水、食物、备用电源、红光手电和离线地图；远离悬崖、水边和未开放区域。","note":"高原不适、雷雨、大风、强对流或道路结冰时停止观测。"}},{"section":"v2:safety","sort":810,"data":{"sectionTitle":"敬畏自然，珍藏每一片暗夜","title":"生态与场地规则","subtitle":"不擅自露营、入保护区或进科研台址","tag":"环保","body":"湿地、草原、林地、自然保护区和科研设施都有管理边界。遵守预约、夜间通行、停车和照明规定，不生火、不留垃圾、不破坏植被。","note":"入选观星推荐区域不代表可自由通宵或架设设备。"}},{"section":"v2:safety","sort":820,"data":{"sectionTitle":"敬畏自然，珍藏每一片暗夜","title":"观测规划工具","subtitle":"光污染 / 星图 / 月相 / 天气","tag":"工具","body":"Light Pollution Map：查看人工光污染；Stellarium：查星体位置；Time and Date：查月相与暮光；中国天气网：看天气预警和逐小时预报。","note":"工具链接见页面底部，临出发仍需核实当地公告。"}},{"section":"v2:safety","sort":830,"data":{"sectionTitle":"敬畏自然，珍藏每一片暗夜","title":"资料边界","subtitle":"推荐地点不是晴夜保证","tag":"说明","body":"本攻略综合暗夜潜力、旅行可达性与观测目标，不是统一标准的全年暗夜排名。开放时间、交通、活动、门票和天气均会变化。","note":"2026 暑期观星指南是暑期适宜区域评估，不能误读为全年最佳地点榜单。"}}];const $=s=>document.querySelector(s),app=$("#app");let rows=[],editId=null,heroId=null;
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
const EDITORIAL_CONTENT={"v2:start":[{"tag":"01 · 初次仰望","title":"第一次观星：先从肉眼开始","subtitle":"不必急着买设备，先学会和夜空相处","body":"第一次出发，带上一颗愿意慢下来的心就够了。找一处视野开阔、远离直射灯光的地方，从月亮、明亮行星和容易辨认的星座开始；给眼睛一点时间适应黑暗，让星星慢慢从夜色里浮现。\n\n推荐地点：上海周边视野开阔的乡野、海岸或正规开放的观星营地；想要更清晰的星空，可把第一次远行放在浙江开化、江苏盐城等长三角目的地。\n建议时间：秋冬晴朗、空气通透的夜晚；选择月亮较晚升起或较早落下的时段。\n轻装准备：保暖外套、红光手电、折叠坐垫、饮水、离线星图。"},{"tag":"02 · 银河初见","title":"想看银河：去一片真正暗下来的地方","subtitle":"从认出银河，到看见银河的纹理","body":"银河不是一条被点亮的云，而是无数恒星汇成的光带。第一次追银河，优先选择远离城市灯光、地平线开阔的荒漠或高原，不需要昂贵望远镜，肉眼和一台能稳定长曝光的相机已经足够开启旅程。\n\n推荐地点：宁夏中卫与腾格里沙漠、内蒙古阿拉善、青海茶卡及柴达木周边。\n建议时间：大致 5—9 月；夏季银河核心在夜间更容易观赏。优先新月前后，并按目的地纬度查询银河升起时间。\n出发准备：至少安排 2 晚；带三脚架、备用电池、红光灯、防潮袋和保暖层。"},{"tag":"03 · 行星寻访","title":"想看木星、土星：把目光交给太阳系","subtitle":"不一定要去荒野，稳定的天空更重要","body":"行星明亮，城市近郊也有机会观察。木星的条纹与卫星、土星的光环，适合用小型天文望远镜慢慢寻找。行星的最佳观测季节每年变化，出发前用星图软件确认当年的位置、高度和可见时段。\n\n推荐地点：视野无遮挡、远离热源和屋顶热气流的郊外草地、湖畔或正规天文观测活动场地。\n建议时间：行星升得较高、天空完全变暗之后；具体月份以当年冲日和星历为准。\n准备重点：稳定三脚架或架台、低至中倍率目镜、星图软件、耐心，以及一处安全平坦的观测位置。"},{"tag":"04 · 深空与极致暗夜","title":"想探索深空：把旅程交给更深的夜","subtitle":"从星团、星云，到遥远星系","body":"当你开始寻找肉眼难见的星云、星团与星系，暗夜质量、透明度和连续观测时间会变得格外重要。这里不只是看见更多星星，也是在学习辨认宇宙深处微弱的光。\n\n推荐地点：青海冷湖及柴达木盆地的合法开放区域；也可考虑远离城镇灯光的阿拉善、宁夏荒漠。\n建议时间：秋冬适合猎户座大星云等目标；夏季适合银河核心及部分夏季深空目标。按目标天体和月相安排。\n准备重点：双筒或望远镜、稳固架台、星图、红光灯、防露措施、备用电源；初次深空摄影建议先参加有导师的观测活动。"}],"v2:destinations":[{"tag":"长三角 · 入门","title":"浙江开化 · 山野暗夜与慢旅行","subtitle":"适合第一次离开城市灯光","body":"特点：山地乡野、森林与村落景观适合把白天徒步和夜间观星结合。具体暗夜质量会随村镇灯光、天气和观测点变化，优先选择合法开放、视野开阔的住宿周边。\n推荐时间：秋季至冬季晴朗夜；春夏也可关注新月窗口。\n2 天 1 夜：Day 1 下午抵达、熟悉周边观测点，晚餐后观星 1—2 小时；Day 2 白天轻徒步或乡村游览后返程。\n行李清单：保暖衣物、红光手电、折叠坐垫、双筒望远镜、离线地图、充电宝。"},{"tag":"长三角 · 湿地与海岸","title":"江苏盐城 · 黄海湿地周边","subtitle":"开阔地平线，适合月亮、行星与星座","body":"特点：地势平坦、地平线开阔，适合初学者辨认星座、月亮和明亮行星。湿地核心区、保护地和景区有明确管理边界，不应擅自夜间进入。\n推荐时间：秋冬冷空气过境后的晴夜；尽量避开雾霾、海雾和强风。\n2 天 1 夜：Day 1 白天游览开放区域，傍晚入住；夜间在许可的公共观景点短时观测。Day 2 安排湿地日间体验后返程。\n准备：防风外套、帽子、红光灯、双筒镜、保温杯；海边注意潮汐与风力。"},{"tag":"西北 · 沙漠星河","title":"宁夏中卫 · 沙坡头与腾格里边缘","subtitle":"沙漠前景与银河摄影的经典组合","body":"特点：沙丘线条能为星空照片提供前景，旅游配套相对成熟；营地灯光、活动照明和夜间开放政策会显著影响观星体验。\n推荐时间：5—10 月择晴夜，银河主题优先 6—8 月的新月窗口；冬季需特别重视低温和风。\n3 天 2 夜：Day 1 抵达中卫、入住；Day 2 白天沙漠活动，日落后在营地许可区域观星与拍摄；Day 3 轻松返程。\n准备：三脚架、广角镜头、备用电池、头灯红光模式、防沙袋、保暖层、饮水。"},{"tag":"西北 · 荒漠暗夜","title":"内蒙古阿拉善 · 腾格里与戈壁","subtitle":"辽阔地貌、星轨与流星雨","body":"特点：远离城市的荒漠区域有机会获得较暗的天空，地貌前景丰富；但风沙、温差、通信和夜间行车风险更高。建议依托正规营地或熟悉当地路况的团队。\n推荐时间：5—9 月较适合长时间户外停留；流星雨年份和极大日期需逐年核对。\n3 天 2 夜：Day 1 抵达并休整；Day 2 白天沙漠体验，夜间观测；Day 3 预留机动时间返程。\n准备：防风防沙外套、护目镜、保暖层、红光灯、三脚架、备用电源、饮水和离线导航。"},{"tag":"青海 · 盐湖星空","title":"青海茶卡 · 盐湖、倒影与银河","subtitle":"适合把星空和高原风景放进同一趟旅程","body":"特点：盐湖、山脉与开阔天空构成独特前景；镜面倒影取决于水面、风力和景区当晚开放情况，不能视为必然效果。\n推荐时间：5—9 月；银河摄影优先新月前后，避开强风和云量较高时段。\n3—4 天：Day 1 抵达并适应海拔；Day 2 白天游览、夜间观星；Day 3 留作天气机动或周边慢游；有余力再延伸德令哈。\n准备：保暖防风衣、墨镜、防晒、三脚架、备用电池、保温水壶；高海拔避免剧烈运动。"},{"tag":"青海 · 深空进阶","title":"青海冷湖 · 柴达木盆地周边","subtitle":"为深空摄影与极致暗夜而去","body":"特点：部分区域具备优良暗夜潜力，适合银河、星野和深空摄影。科研观测设施和台址并非公众景点，必须只在明确开放、获准进入的区域活动。\n推荐时间：春末至秋季可规划长夜观测；具体选择取决于目标天体、月相和当地天气。\n4—5 天：Day 1 抵达并休整；Day 2 熟悉合法观测点；Day 3—4 留给两晚以上观测；Day 5 返程。\n准备：赤道仪或便携跟踪器、稳固三脚架、相机与镜头、露水加热带、备用电源、保暖装备、离线地图及通信备份。"},{"tag":"新疆 · 雅丹星野","title":"新疆哈密 · 大海道周边","subtitle":"雅丹地貌与戈壁星空的电影感","body":"特点：雅丹地貌适合星野摄影，地貌线条能形成强烈画面；路线偏远，部分区域有景区管理、车辆和线路限制，不适合无经验者自行夜间穿越。\n推荐时间：春秋季温差相对可控；夏季需防高温，冬季需防严寒。择无月晴夜安排银河或星轨。\n4—5 天：Day 1 抵达哈密；Day 2 按许可路线进入并日间勘察；Day 3—4 由正规团队安排夜间拍摄；Day 5 返程。\n准备：防沙防风装备、广角镜头、三脚架、头灯、足量饮水、车载应急物资、离线地图与团队通信。"},{"tag":"西南 · 高山星空","title":"四川牛背山及川西高山区域","subtitle":"雪山、云海与星空前景","body":"特点：高山观景平台能带来壮阔前景，但云海、风力、道路和高海拔天气变化很快；并非每个晴朗白天都意味着夜间无云。\n推荐时间：秋冬晴朗窗口常受关注，出发前密切查看道路和景区公告。\n3—4 天：Day 1 抵达并适应；Day 2 白天观景、夜间短时观测；Day 3 留作天气机动；Day 4 返程。\n准备：厚羽绒、防风层、手套、保暖鞋、红光灯、暖宝宝、备用电源；有高原不适立即停止活动并及时就医。"}],"v2:calendar":[{"tag":"3—5 月 · 春","title":"春夜：银河在后半夜升起","subtitle":"适合愿意为星河多等一会儿的人","body":"观测重点：春季星座、球状星团；银河核心逐渐在后半夜出现，越接近初夏，合适时段越靠前。\n优先目的地：开化等长三角暗夜点可做短途练习；想追银河可规划宁夏、阿拉善或青海。\n出发提示：安排新月附近，查询银河升起时间，远途预留至少两晚天气窗口。"},{"tag":"6—8 月 · 夏","title":"夏夜：银河核心的黄金时段","subtitle":"一年中最适合安排银河主题旅行的季节之一","body":"观测重点：银河核心、夏季星座、英仙座流星雨。英仙座流星雨通常在 8 月中旬达到极大，具体日期与月相每年核对。\n优先目的地：中卫、腾格里、茶卡、柴达木及新疆戈壁。\n出发提示：西北白天炎热、夜间温差大；带防晒、饮水、防风保暖和拍摄备用电源。"},{"tag":"9—11 月 · 秋","title":"秋夜：暗夜、星系与舒适的远行","subtitle":"适合深空入门与慢节奏观星","body":"观测重点：仙女座星系 M31、秋季星座、银河尾段；部分地区空气透明度较好，但需看实时天气。\n优先目的地：青海、宁夏、阿拉善及川西部分高山观景区。\n出发提示：昼夜温差开始增大，携带防风保暖层；深空目标尽量避开月光。"},{"tag":"12—2 月 · 冬","title":"冬夜：猎户座与流星划过长空","subtitle":"寒冷，却有北半球最醒目的冬季星空","body":"观测重点：猎户座大星云 M42、昴星团 M45、冬季明亮星座；双子座流星雨通常在 12 月中旬出现，极大日期每年核对。\n优先目的地：华东晴冷夜可练习月亮、行星与星座；西北荒漠适合有经验者进行深空或星野拍摄。\n出发提示：保暖优先于器材升级，电池贴身存放，注意镜头结露和低温续航。"}],"v2:targets":[{"tag":"技巧 01 · 让眼睛看见更多","title":"暗适应：给夜色 20—30 分钟","subtitle":"别让屏幕把星空重新关掉","body":"到达观测点后尽量避免白光，手机调至最低亮度或收起；使用红光灯看地图和设备。暗适应需要时间，期间频繁看强光会让眼睛重新适应明亮环境。\n适合练习：在开阔、远离路灯的乡野或海岸，从辨认北斗七星、夏季大三角等明亮星群开始。"},{"tag":"技巧 02 · 找到目标","title":"星图导航：先认方向，再找星座","subtitle":"让手机成为地图，而不是夜空里的灯塔","body":"提前下载离线星图，了解目标天体的大致方位和高度；到场后先用肉眼定位亮星，再用双筒或寻星镜逐步靠近目标。手机屏幕尽量使用红色夜间模式。\n适合练习：任何视野开阔、地平线无遮挡的观测点；行星和亮星不要求极暗夜。"},{"tag":"技巧 03 · 双筒观察","title":"双筒望远镜：从宽阔视野开始","subtitle":"7×50 或 10×50 是常见入门选择","body":"双筒适合月面、星团和银河星野。先稳定站姿或靠在支撑物上，低倍率扫视，再慢慢辨认星团结构；不要一开始就追求高倍率。长时间观察可使用躺椅或三脚架转接座。\n适合目标：昴星团、毕宿星团、银河星野和月面。"},{"tag":"技巧 04 · 看行星","title":"行星观测：高度与视宁度比倍率重要","subtitle":"看得稳，比放得大更重要","body":"尽量等目标升到较高位置，避开地面热气流、屋顶和道路上方的扰动。先用低倍率找到目标，再逐级增加倍率；若画面持续晃动或模糊，降低倍率并等待空气稳定。\n推荐地点：无遮挡、远离热源的郊外平台；城市周边也可以观察明亮行星。"},{"tag":"技巧 05 · 拍银河与流星","title":"星野摄影：稳定、对焦与耐心","subtitle":"先拍清楚一张，再追求更复杂的作品","body":"相机固定在三脚架上，使用广角镜头、手动对焦和较高 ISO，曝光时间需根据焦距、像素和天空情况调整，避免星点拖线；拍摄前关闭强光源，先试拍检查焦点。流星雨则用广角覆盖大块天空，连续拍摄并耐心等待。\n推荐地点：中卫、阿拉善、茶卡及冷湖周边获准开放的暗夜区域。"}],"v2:conditions":[{"tag":"出发前 · 第一封星空邀请","title":"先选一个值得等待的夜晚","subtitle":"让月相、天气和心情一起指向远方","body":"把观星当作一次与夜空的约会：先选想看的目标，再挑月亮较暗的日期，最后观察云量、透明度、风和降水。不要只看天气 App 上的“晴”字，薄云、雾霾和高湿度也会让星空失去层次。"},{"tag":"月光 · 留一片暗夜","title":"新月前后，给银河留出舞台","subtitle":"同时查询月出、月落与天文暮光","body":"银河和暗弱深空更适合无月或弱月光时段；如果月亮在前半夜落下，后半夜仍可能出现暗夜窗口。满月附近也有适合的目标，例如月面、明亮行星和部分双星。"},{"tag":"天气 · 等一场通透的晴夜","title":"云量之外，还要看透明度与风","subtitle":"出发前 24—48 小时复查","body":"重点关注低云、高云、能见度、湿度、露点、阵风和降水。银河摄影尤其怕薄高云和雾霾；望远镜观测行星还要关注视宁度。遇雷雨、强风、道路结冰或能见度骤降，应取消夜间活动。"},{"tag":"暗夜 · 远离人工光","title":"把灯光留在身后","subtitle":"暗夜不是越偏远越好，合法与安全更重要","body":"用光污染地图初筛目的地，到场后选择已开放的观测区域。避开车灯、营地探照灯和手机白光；不要为追求黑暗进入保护区禁入地、科研设施或无通信的危险地带。"}],"v2:gear":[{"tag":"LEVEL 01 · 裸眼入门","title":"先不买设备：认识夜空","subtitle":"成本最低，也最能培养方向感","body":"装备：红光手电、保暖衣物、折叠坐垫、离线星图和饮水。\n能力目标：辨认方向、明亮星座、行星与流星；理解月相、银河季节和暗适应。\n升级时机：当你开始想看更细的星团结构，再考虑双筒望远镜。"},{"tag":"LEVEL 02 · 双筒进阶","title":"一副双筒，打开更丰富的星野","subtitle":"便携、易上手，适合旅行携带","body":"常见选择：7×50 或 10×50 双筒；倍率越高越需要稳定支撑。\n适合目标：月面、昴星团、毕宿星团、银河星野和部分明亮深空目标。\n搭配：轻便三脚架转接座、星图、镜头布和防潮收纳。"},{"tag":"LEVEL 03 · 望远镜目视","title":"从寻找目标，到观察细节","subtitle":"月球、木星、土星与明亮深空","body":"装备：稳定架台、入门折射或反射望远镜、低中倍率目镜、寻星镜、准直工具（视镜型而定）。\n重点不只是口径，还包括架台稳定、光轴校准、寻星和搬运。先学会快速对准，再逐步增加目镜和滤镜。"},{"tag":"LEVEL 04 · 星野摄影","title":"让相机记录银河的形状","subtitle":"从固定三脚架拍摄开始","body":"装备：可手动曝光的相机、广角大光圈镜头、稳固三脚架、快门控制、备用电池和防露用品。\n先掌握手动对焦、曝光、白平衡和 RAW；稳定产出后，再学习多张堆栈与前景合成。"},{"tag":"LEVEL 05 · 深空摄影","title":"追踪微弱的光，进入深空世界","subtitle":"设备、校准与后期共同决定结果","body":"装备：赤道仪或跟踪器、望远镜或长焦镜头、导星系统、供电、露水加热带、采集与后期软件。\n学习顺序：极轴校准 → 对焦 → 导星 → 拍摄序列 → 平场/暗场等校准帧 → 堆栈与后期。建议先在有经验者指导下完成整套流程。"}],"v2:routes":[{"tag":"路线 A · 第一次观星","title":"2 天 1 夜 · 长三角轻量星空约会","subtitle":"开化或盐城周边 · 肉眼与双筒","body":"Day 1：白天抵达、入住，傍晚在开放区域熟悉地形；晚餐后观测月亮、行星和星座，给暗适应留出时间。\nDay 2：睡到自然醒，安排轻徒步或当地风景后返程。\n适合：第一次观星、周末出发、希望轻装体验的人。\n带上：保暖外套、红光灯、双筒、坐垫、离线星图。"},{"tag":"路线 B · 银河旅行","title":"4 天 3 夜 · 中卫与腾格里沙漠","subtitle":"沙漠日落、银河夜色与星野摄影","body":"Day 1：抵达中卫，休整并确认营地观测安排。\nDay 2：白天沙漠体验，日落前勘察前景，夜间拍摄银河。\nDay 3：留作第二个观测窗口，或在月亮升起前完成星野拍摄。\nDay 4：返程。\n带上：三脚架、广角镜头、备用电池、防沙袋、红光灯、防风保暖和饮水。"},{"tag":"路线 C · 极致暗夜","title":"5 天 4 夜 · 青海德令哈与柴达木","subtitle":"为连续暗夜与深空观测留足时间","body":"Day 1：抵达并休整，适应高海拔。\nDay 2：白天短途熟悉合法观测点，夜间测试设备。\nDay 3—4：安排两晚主要观测，按月相和目标天体选择窗口。\nDay 5：机动返程。\n带上：望远镜或双筒、三脚架、赤道仪（进阶）、防露用品、保暖层、备用电源和离线导航。"},{"tag":"路线 D · 雅丹星野","title":"5 天 4 夜 · 哈密大海道周边","subtitle":"把地貌、星轨与银河放进同一幅画面","body":"Day 1：抵达哈密并休整。\nDay 2：由正规团队按许可路线进行日间勘察。\nDay 3：根据月相和天气安排银河或星轨拍摄。\nDay 4：保留第二个夜晚作为天气备份。\nDay 5：返程。\n带上：防沙防风装备、广角镜头、三脚架、头灯、饮水、应急物资和团队通信设备。"},{"tag":"路线 E · 流星雨之夜","title":"3 天 2 夜 · 把一整晚交给流星","subtitle":"选择年度极大日期附近，远离灯光","body":"Day 1：白天抵达暗夜营地，熟悉安全范围和休息区。\nDay 2：白天休息，傍晚补给；夜间选择开阔地平线，使用躺椅或防潮垫连续观测。\nDay 3：休息后返程。\n带上：厚衣物、睡袋或保暖毯、躺椅、防潮垫、热饮、红光灯。流星雨极大日期和月相每年重新核对。"},{"tag":"路线 F · 行星与月面","title":"周末 2 天 · 近郊望远镜观测","subtitle":"不追远方，也能认识太阳系","body":"Day 1：选择视野开阔、地面稳定且远离热源的正规场地；日落后先看月亮，再寻找当晚可见的木星或土星。\nDay 2：复盘星图和观测记录。\n带上：小型望远镜、稳定架台、目镜、红光灯、星图和防露布。具体行星以当年星历为准。"}],"v2:safety":[{"tag":"天文学常识","title":"暗夜等级：不是所有黑夜都一样","subtitle":"光污染会改变你能看见的宇宙","body":"常见的 Bortle 暗夜等级从 1（极暗）到 9（明亮城市天空），可作为选址参考，但地图估值不等于现场实测。月光、湿度、薄云和周边灯源都会改变实际观感。"},{"tag":"天文学常识","title":"透明度与视宁度：两个不同的好天气","subtitle":"看银河与看行星，关注点并不相同","body":"透明度描述天空是否清澈、是否容易看见暗弱天体；视宁度描述大气扰动对望远镜成像稳定性的影响。银河摄影更看重透明度，行星高倍率观测更依赖良好视宁度。"},{"tag":"观测知识","title":"天文暮光、月相与目标高度","subtitle":"决定星空何时真正进入最佳状态","body":"太阳落山后天空仍会经历民用、航海和天文暮光阶段；深空观测通常要等天文暮光结束。目标越接近天顶，通常越少受到近地层大气影响。出发前用星图同时查目标升落和高度。"},{"tag":"设备维护","title":"结露、低温与电池管理","subtitle":"别让设备在最美的夜晚提前退场","body":"镜头和望远镜温度接近露点时容易结露；可使用防露带和防潮收纳。低温会缩短电池续航，备用电池贴身保温；回到室内前先密封设备，避免温差造成冷凝。"},{"tag":"安全与暗夜礼仪","title":"让星空保持安静，也让同行的人安心","subtitle":"不越界、不独行、不用强光打扰别人","body":"提前告知同行者路线与返程时间；夜间不靠近悬崖、水边和未开放区域，不擅自进入保护区或科研台址。观测时避免白光、激光笔和无人机；不生火、不留垃圾、不破坏植被。高原不适、雷雨、大风或道路结冰时停止活动。"}]};
function drawHero(d){const h=$("#hero");h.replaceChildren();h.append(el("h1","", "Chasing Stars, Discovering Worlds."));h.append(el("p","hero-summary","日落之后，世界并没有结束，而是开启了另一场壮丽的旅程。群山沉入夜色，银河缓缓升起，亿万颗星辰在头顶铺展开来。我们带着好奇与期待，奔赴那些遥远而宁静的地方，在浩瀚宇宙面前，重新感受生命与世界的浪漫。"));h.append(el("p","lead","追逐星辰，探索世界。"));const edit=el("button","btn","编辑主题");edit.style.display=document.body.classList.contains("editing")?"inline-block":"none";edit.onclick=()=>openHero(d);h.append(edit)}
function draw(){const h=rows.find(r=>r.section==="v2:hero");heroId=h?.id||null;drawHero(h?.data||DEFAULTS[0].data);app.replaceChildren();const keys=["v2:start","v2:destinations","v2:calendar","v2:targets","v2:conditions","v2:gear","v2:routes","v2:safety"];const titles={"v2:start":"星辰召唤，从此刻启程","v2:destinations":"人间山海，皆是观星之境","v2:calendar":"星移斗转，岁岁皆有银河","v2:targets":"穿越光年，凝望宇宙深处","v2:conditions":"择一片晴空，候万千星辰","v2:gear":"以微光为伴，以好奇为舟","v2:routes":"循着星光，去往远方","v2:safety":"敬畏自然，珍藏每一片暗夜"};let idx=0;for(const key of keys){const editorial=EDITORIAL_CONTENT[key]||[];const sourceRows=rows.filter(r=>r.section===key).sort((a,b)=>(a.sort||0)-(b.sort||0));const id="section-"+idx++,sec=el("section","sec");sec.id=id;const heading=el("h2","",titles[key]);sec.append(heading);const intro=el("p","section-intro",({ "v2:start":"从第一次抬头，到真正读懂星空。每一种向往，都有适合自己的起点。","v2:destinations":"把目的地交给季节，把夜晚交给星河。以下路线以观测体验为核心，出发前请再次确认当地开放与天气情况。","v2:calendar":"先决定想看的天象，再选择出发的月份。天象日期每年略有变化，流星雨极大与行星位置请以当年星历为准。","v2:targets":"观星不只是等待星星出现，也是一门可以慢慢练习的技艺。","v2:conditions":"在出发之前，先为自己挑选一场值得等待的夜晚。让准备成为旅程的一部分。","v2:gear":"装备不是目的，而是陪你走得更远的工具。按兴趣逐级添置，不必一次买齐。","v2:routes":"从一晚短途到数夜远征，按观测主题选择路线，让白天与夜晚都值得期待。","v2:safety":"真正好的观星体验，不止于看见星辰，也包括理解夜空、尊重自然，并平安回家。"}[key]));sec.append(intro);const grid=el("div","grid");editorial.forEach((d,i)=>{const source=sourceRows[i];const displayData=source?.data?.editorialOverride?source.data:d;const card=el("article","card");card.append(el("span","tag",displayData.tag||"观星指南"));card.append(el("h3","",displayData.title||"观星笔记"));if(displayData.subtitle)card.append(el("p","sub",displayData.subtitle));if(displayData.body)card.append(el("div","body",displayData.body));if(displayData.note)card.append(el("div","note",displayData.note));if(source){const e=el("button","edit","✎");e.title="编辑此内容";e.onclick=()=>openModal({...source,data:displayData});card.append(e)}grid.append(card)});sec.append(grid);app.append(sec);}}

function openModal(r){editId=r?.id||null;const d=r?.data||{};$("#modalTitle").textContent=r?"编辑卡片":"添加卡片";$("#f_section").value=(r?.section||"v2:custom").replace(/^v2:/,"");$("#f_sectionTitle").value=d.sectionTitle||"";$("#f_title").value=d.title||"";$("#f_subtitle").value=d.subtitle||"";$("#f_tag").value=d.tag||"";$("#f_body").value=d.body||"";$("#f_note").value=d.note||"";$("#modal").classList.add("open")}

async function save(){const title=$("#f_title").value.trim();if(!title){alert("请填写标题");return}const sec=$("#f_section").value.trim()||"custom";const data={sectionTitle:$("#f_sectionTitle").value.trim(),title,subtitle:$("#f_subtitle").value.trim(),tag:$("#f_tag").value.trim(),body:$("#f_body").value,note:$("#f_note").value,editorialOverride:true};const rec={page:PAGE,section:"v2:"+sec,sort:Date.now()%1000000,data};let q=editId?await sb.from("pages_blocks").update(rec).eq("id",editId):await sb.from("pages_blocks").insert(rec);if(q.error){alert("保存失败："+q.error.message);return}$("#modal").classList.remove("open");await refresh()}
async function remove(r){if(!confirm("删除这张新版卡片？旧版数据不受影响。"))return;const q=await sb.from("pages_blocks").delete().eq("id",r.id);if(q.error){alert(q.error.message);return}await refresh()}
$("#editToggle").onclick=()=>{document.body.classList.toggle("editing");$("#editToggle").textContent=document.body.classList.contains("editing")?"完成编辑":"编辑";draw()};
$("#addBtn").onclick=()=>openModal(null);$("#cancel").onclick=()=>$("#modal").classList.remove("open");$("#save").onclick=save;$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(rows,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=PAGE+"-v2.json";a.click()};
sb.channel("blocks-"+PAGE+"-v2").on("postgres_changes",{event:"*",schema:"public",table:"pages_blocks"},refresh).subscribe();load();
})();
</script>
<script>
(()=> {
  const intro=document.getElementById('skyIntro');
  const starCanvas=document.getElementById('skyStars');
  const meteorCanvas=document.getElementById('skyMeteors');
  const starCtx=starCanvas&&starCanvas.getContext('2d');
  const meteorCtx=meteorCanvas&&meteorCanvas.getContext('2d');
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let width=0,height=0,dpr=1,stars=[],meteors=[],sparks=[],raf=0,last=0,nextSpawn=0,elapsed=0,stopped=false;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const resize=()=>{
    width=window.innerWidth;height=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,1.5);
    [starCanvas,meteorCanvas].forEach(canvas=>{if(!canvas)return;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px'});
    if(starCtx){starCtx.setTransform(dpr,0,0,dpr,0,0);starCtx.clearRect(0,0,width,height);stars=Array.from({length:Math.min(320,Math.round(width*height/3900))},()=>({x:Math.random()*width,y:Math.random()*height,r:rand(.25,1.35),a:rand(.18,.7),phase:rand(0,Math.PI*2),speed:rand(.35,1.1),warm:Math.random()<.16}));}
    if(meteorCtx)meteorCtx.setTransform(dpr,0,0,dpr,0,0);
  };
  const spawnMeteor=(edge)=>{
    const side=edge||['top','left','right'][Math.floor(Math.random()*3)];
    let x,y,angle;
    if(side==='top'){x=rand(width*.08,width*.96);y=rand(-35,height*.22);angle=rand(34,58)*Math.PI/180}
    else if(side==='left'){x=rand(-35,width*.16);y=rand(height*.04,height*.62);angle=rand(22,48)*Math.PI/180}
    else{x=rand(width*.78,width+35);y=rand(height*.02,height*.55);angle=rand(122,151)*Math.PI/180}
    const speed=rand(520,930),length=rand(115,260),life=rand(.72,1.28);
    meteors.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,speed,life,age:0,length,width:rand(1.1,2.1),glow:rand(8,17),hue:Math.random()<.22?'#d9e8ff':'#fff4dc',sparkAt:0});
  };
  const burst=()=>{const edge=['top','left','right'][Math.floor(Math.random()*3)];spawnMeteor(edge);setTimeout(()=>{if(!stopped&&!document.hidden)spawnMeteor(edge)},rand(110,260));setTimeout(()=>{if(!stopped&&!document.hidden)spawnMeteor()},rand(280,520));};
  const drawStars=(time)=>{
    if(!starCtx)return;starCtx.clearRect(0,0,width,height);
    for(const s of stars){const twinkle=.68+.32*Math.sin(time*.0007*s.speed+s.phase);starCtx.globalAlpha=s.a*twinkle;starCtx.fillStyle=s.warm?'#ffe8c5':'#e8f1ff';starCtx.beginPath();starCtx.arc(s.x,s.y,s.r,0,Math.PI*2);starCtx.fill();if(s.r>1.05){starCtx.globalAlpha*=.24;starCtx.fillRect(s.x-3,s.y-.35,6,.7);starCtx.fillRect(s.x-.35,s.y-3,.7,6)}}starCtx.globalAlpha=1;
  };
  const drawMeteor=(m)=>{
    const p=Math.min(1,m.age/m.life),fade=Math.min(1,p*8,(1-p)*5),x=m.x,y=m.y,tx=x-m.vx/m.speed*m.length,ty=y-m.vy/m.speed*m.length;
    const g=meteorCtx.createLinearGradient(tx,ty,x,y);g.addColorStop(0,'rgba(130,170,230,0)');g.addColorStop(.48,'rgba(166,198,245,.12)');g.addColorStop(.82,'rgba(214,229,255,.58)');g.addColorStop(1,m.hue);
    meteorCtx.save();meteorCtx.globalAlpha=fade;meteorCtx.lineCap='round';meteorCtx.strokeStyle=g;meteorCtx.lineWidth=m.width;meteorCtx.shadowColor='#b8d4ff';meteorCtx.shadowBlur=m.glow;meteorCtx.beginPath();meteorCtx.moveTo(tx,ty);meteorCtx.lineTo(x,y);meteorCtx.stroke();
    meteorCtx.shadowBlur=m.glow*1.5;meteorCtx.fillStyle='#fff';meteorCtx.beginPath();meteorCtx.arc(x,y,m.width*1.15,0,Math.PI*2);meteorCtx.fill();
    meteorCtx.restore();
  };
  const frame=(now)=>{
    if(stopped||!intro||intro.hidden||document.hidden)return;
    const dt=Math.min((now-last)/1000||0,.04);last=now;elapsed+=dt;
    drawStars(now);
    if(meteorCtx){meteorCtx.clearRect(0,0,width,height);if(elapsed>nextSpawn){if(Math.random()<.13)burst();else spawnMeteor();nextSpawn=elapsed+rand(1.1,2.8)}
      for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.age>=m.life||m.x<-400||m.x>width+400||m.y>height+400){meteors.splice(i,1);continue}drawMeteor(m)}
    }
    raf=requestAnimationFrame(frame);
  };
  const start=()=>{if(reduced||stopped||raf)return;last=performance.now();raf=requestAnimationFrame(frame)};
  const pause=()=>{if(raf)cancelAnimationFrame(raf);raf=0};
  const enter=document.getElementById('skyEnter');
  let transitionTimer=0,touchStartY=0,touchStartX=0;
  const close=()=>{
    if(!intro||intro.classList.contains('is-leaving')||intro.hidden)return;
    intro.classList.add('is-leaving');document.body.classList.remove('sky-locked','guide-main-hidden');document.body.classList.add('guide-main-visible');
    window.clearTimeout(transitionTimer);
    transitionTimer=window.setTimeout(()=>{intro.hidden=true;intro.setAttribute('aria-hidden','true')},920);
  };
  const showIntro=()=>{
    if(!intro||!intro.hidden||window.scrollY>4)return;
    window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
    intro.hidden=false;intro.setAttribute('aria-hidden','false');intro.classList.remove('is-leaving');
    document.body.classList.remove('guide-main-visible');document.body.classList.add('guide-main-hidden','sky-locked');
    stopped=false;meteors=[];elapsed=0;nextSpawn=.35;start();
  };
  const bindSwipe=(node,onDown,onUp)=>{
    if(!node)return;
    node.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartY=t.clientY;touchStartX=t.clientX},{passive:true});
    node.addEventListener('touchend',e=>{const t=e.changedTouches[0],dy=t.clientY-touchStartY,dx=t.clientX-touchStartX;if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.2){if(dy>0)onDown();else onUp()}},{passive:true});
  };
  bindSwipe(intro,close,()=>{});
  bindSwipe(document,()=>{},showIntro);
  intro&&intro.addEventListener('wheel',e=>{if(e.deltaY>25){e.preventDefault();close()}},{passive:false});
  window.addEventListener('wheel',e=>{if(intro&&intro.hidden&&window.scrollY<=4&&e.deltaY< -25){e.preventDefault();showIntro()}},{passive:false});
  window.addEventListener('keydown',e=>{if(intro&&intro.hidden&&window.scrollY<=4&&(e.key==='ArrowUp'||e.key==='PageUp')&&!e.metaKey&&!e.ctrlKey)showIntro()});
  resize();if(!reduced)start();
  let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,140)},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else if(!stopped)start()});
  document.body.classList.add('sky-locked','guide-main-hidden');
  if(enter)enter.addEventListener('click',close);
  if(intro)intro.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
